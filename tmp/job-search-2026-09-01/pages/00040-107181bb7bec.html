    <meta name="title" property="og:title" content="2027 Summer Analyst - Software Engineering Rotational Program (New York City)">
    <meta name="description" property="og:description" content="Role Type: Work Term: Work Location: New York, New York, United States of America Hours: 40 Pay Details: - TD is committed to providing fair and equitable compensation opportunities to all colleagues. Growth opportunities and skill development are defining features of the colleague experience at TD. Our compensation policies and practices have been designed to allow colleagues to progress through the salary range over time as they progress in their role. The base pay actually offered may vary based upon the candidate&#39;s skills and experience, job-related knowledge, geographic location, and other specific business and organizational needs. As a candidate, you are encouraged to ask compensation related questions and have an open dialogue with your recruiter who can provide you more specific details for this role. Job Description: TD Securities provides a wide range of capital market products and services to corporate, government and institutional clients. The firm works with clients around the world, focusing selectively and strategically on the key financial centers: New York, Houston, Toronto, Vancouver, Calgary, Montreal, Dublin, Tokyo, Singapore and London. Within TD Securities, Technology Solutions is the FinTech division that engineers platforms that support the leading-edge business capabilities required to help TD Securities maintain its position as a prominent and award-winning investment dealer. We collaborate closely with colleagues across the organization to develop and implement innovative solutions that facilitate revenue generation, provide our clients with frictionless end-to-end experiences and enable the expansion of TD Securities&#39; capabilities across the globe. Job Description TD Securities Technology offers a FinTech Summer Internship Program that is an unparalleled experience – where you’ll gain valuable insight into our vision to Build The Better Bank, while also strengthening the core skills and knowledge you’ll need to launch a successful career. Software Engineer Rotational Program Experience Our 10 week non-rotational program consists of: A fun-filled, high-energy introduction to TD A variety of professional experiences, including substantive technical assignments to help grow and expand your technical skill sets Professional development training Extensive networking opportunities Interaction and dedicated chats with senior leaders A dedicated support network, including a formal peer-mentoring program Brand new modern office with sitting/standing adjustable desks, foosball table, air hockey, ping pong, cold brew coffee on tap, weekly ice cream socials, happy hours and more! An active role in community service projects How You Will Contribute Participate on a team with targeted deliverables, working on initiatives designed to develop new functionality, improve processes, systems and applications which support our key businesses at TD Securities. Produce high quality code for various initiatives and ensure defect free programming by testing and debugging using available/appropriate tools and participate in peer code reviews Develop new applications/solutions with consistent quality standards; provide code maintenance and support during testing cycles and post-production deployment Work with technologies such as: JavaScript, Angular, React, SQL, NoSql, C++, C#, Java, Scala, Python, NodeJS, RESTful APIs, Hadoop stack (HBase, HDFS), Spark API (DataFrame, DataSet), enterprise integration patterns and messaging systems (Kafka, ZeroMQ), etc Summer Software Engineers typically work on Financial Securities-related Technology projects such as: trade capture, real-time derivatives pricing &amp;amp; risk mgmt., PNL, quant modeling, algo execution &amp;amp; hedging, big data analytics, electronic trading &amp;amp; STP, valuations, etc Summer Software Engineers will typically learn about financial products (no prior finance knowledge is required!) such as: equity derivatives, interest rate derivatives, FX spot &amp;amp; derivatives trading (market making, algo trading &amp;amp; hedging), fixed income, credit derivatives, commodity derivatives, mortgage-backed securities (MBS), etc Beyond the Internship Our Summer Internship Program at TD Securities serves as a feeder program for our FinTech Software Engineer Rotation Program upon graduation. Each year several high-performing interns receive full-time offers for the rotation program upon completion of their summer internship. The Rotation Program is a competitive program in which recent grads rotate to 4 Financial Technology teams within their first 2 years at TD Securities. This program provides exposure to a variety of technology areas and businesses within TD Securities. The program provides an on-boarding curriculum, mentoring, rotational training, and on the job experience in the core activities of TD Securities Financial Technology as well as ongoing leadership development throughout the rotational period &amp;amp; career. Our Technology leaders are committed to people development, career advancement, and value diversity and inclusion. Requirements Graduation date between December 2027 to May 2029 (undergraduate degree) Pursuing a degree in Computer Science, Engineering, Math or Technology Sciences Strong conceptual, analytical and problem solving skills; basic knowledge of SDLC Excellent verbal &amp;amp; written communication with ability to work effectively in a team environment Ability to develop good business relationships with customers, business partners and stakeholders Familiarity and strength in 1 or more of the following: JavaScript, Angular, React, SQL, NoSql, C++, C#, Java, Scala, Python, NodeJS, RESTful APIs, Hadoop stack (HBase, HDFS), Spark API (DataFrame, DataSet), enterprise integration patterns and messaging systems (Kafka, ZeroMQ), etc. Must have US Citizenship or Permanent Residency status NOTE: No prior finance knowledge is required! We will teach you what you need to know! Who We Are TD is one of the world&#39;s leading global financial institutions and is the fifth largest bank in North America by branches/stores. Every day, we strive to make every interaction, product, and experience remarkably human and refreshingly simple for over 27 million households and businesses in Canada, the United States and around the world. More than 95,000 TD colleagues bring their skills, talent, and creativity to foster deeper relationships, ensure disciplined execution, and build a simpler, faster banking experience. TD is deeply committed to being a leader in client experience, that is why we believe that all colleagues, no matter where they work, are client facing. Together, we are reimagining what banking can be for our clients, colleagues and communities. Our Total Rewards Package Our Total Rewards package reflects the investments we make in our colleagues to help them and their families achieve their financial, physical and mental well-being goals. Total Rewards at TD includes base salary and variable compensation/incentive awards (e.g., eligibility for cash and/or equity incentive awards, generally through participation in an incentive plan) and several other key plans such as health and well-being benefits, savings and retirement programs, paid time off (including Vacation PTO, Flex PTO, and Holiday PTO), banking benefits and discounts, career development, and reward and recognition. Learn more Additional Information: We’re delighted that you’re considering building a career with TD. Through regular development conversations, training programs, and a competitive benefits plan, we’re committed to providing the support our colleagues need to thrive both at work and at home. Colleague Development If you’re interested in a specific career path or are looking to build certain skills, we want to help you succeed. You’ll have regular career, development, and performance conversations with your manager, as well as access to an online learning platform and a variety of mentoring programs to help you unlock future opportunities. If you’re passionate about helping clients and building deep, lasting relationships, TD offers diverse career paths where you can grow your expertise and make a meaningful impact. We&#39;re committed to your success and foster a respectful workplace where diverse perspectives are valued, everyone has fair opportunities to grow, and you can unlock your full potential to achieve your career goals. Here at TD, we hire and develop the best. Training &amp;amp; Onboarding We will provide training and onboarding sessions to ensure that you’ve got everything you need to succeed in your new role. Interview Process We’ll reach out to candidates of interest to schedule an interview. We do our best to communicate outcomes to all applicants by email or phone call. Accommodation TD Bank is an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability, status as a protected veteran or any other characteristic protected under applicable federal, state, or local law. If you are an applicant with a disability and need accommodations to complete the application process, please email TD Bank US Workplace Accommodations Program at USWAPTDO@td.com. Include your full name, best way to reach you and the accommodation needed to assist you with the applicant process. US Labor &amp;amp; Employment Posters | California Privacy | Accessibility | FAQ Our Values At TD we’re guided by our purpose to enrich the lives of our customers, communities and colleagues, and share a set of values that shape our culture and guide our behavior. In exchange for how our colleagues show up to help TD succeed, we are committed to delivering a colleague experience grounded in Impact, Growth and a Culture of Care. No matter where you work across TD, we empower you to make an impact at work and in your community, explore and grow your career and be part of our caring and inclusive culture. Our Commitment to Diversity, Equity, and Inclusion At TD, we’re committed to fostering an environment where all colleagues are encouraged to bring their authentic selves to work, experience equitable opportunities, and feel respected and supported. We’re dedicated to building an inclusive workforce that reflects the diversity of the customers and the communities in which we live and serve. Helping to Make an Impact in Communities – TD Ready Commitment TD has a long-standing commitment to help drive progress towards a more inclusive and sustainable future. That’s why we launched the TD Ready Commitment in 2018, now a multi-year North American initiative. Under the TD Ready Commitment, we are targeting a total of C$1 billion by 2030 in community giving across four key, interconnected drivers of change: Financial Security, Vibrant Planet, Connected Communities, and Better Health. It’s our goal to help support change, nurture progress, and contribute to making the world a better, more inclusive place for our customers, colleagues, and communities. Learn more: Canada | US | Europe &amp;amp; Asia Pacific">
