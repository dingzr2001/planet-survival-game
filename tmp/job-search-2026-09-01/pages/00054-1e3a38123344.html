    <meta name="description" property="og:description" content="Are you a new or upcoming graduate seeking an entry-level opportunity in the realm of Software Engineering? Look no further than the prestigious Risk Solutions Technology Graduate Program. About the Business LexisNexis® Risk Solutions provides customers with solutions and decision tools that combine public and industry-specific content with advanced technology and analytics to assist them in evaluating and predicting risk and enhancing operational efficiency. We use the power of data and advanced analytics to help our customers make better, timelier decisions. By bringing clarity to information, we ultimately help make communities safer, insurance rates more accurate, commerce more transparent, business decisions easier, and processes more efficient. You can learn more about LexisNexis Risk at the link below, https://risk.lexisnexis.com/ About our Team LexisNexis Risk Solutions is a trusted data analytics provider, empowering organizations to manage risks, discover opportunities, and drive improved results. Our commitment to excellence and security enables well-informed decisions. Our commitment to excellence is unwavering as we deliver targeted solutions that empower well-informed decisions while upholding the highest standards of security and privacy. If you&#39;re eager to join a dynamic and innovative software development team, with a strong technology infrastructure, and contribute to products that truly make a difference, we invite you to apply for our 2027 Technology Graduate Program - Entry Level Software Engineer role. About the Role The Risk Solutions Technology Graduate Program is a 12-month experience with two six-month rotations. Participants gain hands-on experience in big data, AI, SRE, DevOps, and security engineering. They also get exposure to leading cloud platforms like AWS and Azure. The program focuses on technical and personal development, offering mentorship, performance feedback, and extensive training. Emphasis is placed on utilizing data for good, supporting key markets in insurance, healthcare, and government, and contributing to innovative product development. Responsibilities Writing and reviewing portions of detailed specifications for developing system components of simple complexity. Implementing successful development processes, coding best practices, and code reviews under senior-level engineers&#39; guidance. Operating in various development environments and collaborating with key stakeholders. Completing simple bug fixes and applying knowledge of test-driven development. Collaborating with stakeholders to gather and analyze requirements for software development projects. Resolving basic technical issues and staying updated on new technology developments. Demonstrating basic knowledge of software development methodologies and data manipulation languages. Understanding data modeling principles and applicable development languages. Requirements Applicants must have a graduation date between May 2026 and December 2026 to be considered. Have completed or will complete a bachelor’s in Computer Science or a related field of study. Possess excellent communication skills, both written and verbal, to effectively collaborate with team members. Be proficient in development languages such as Java/J2EE, Python, JavaScript, JSP, C/C++, HTML, XML, SQL, Windows, Linux, and .Net. Be familiar with software development methodologies (e.g., Agile, Waterfall). Be knowledgeable about data manipulation languages and data modeling principles. Have the ability and desire to learn new processes and technologies. Be knowledgeable about test-driven development. Learn more about the LexisNexis Risk team and how we work here U.S. National Base Pay Range: $59,200 - $98,600. Geographic differentials may apply in some locations to better reflect local market rates. This job is eligible for an annual incentive bonus. We know your well-being and happiness are key to a long and successful career. We are delighted to offer country specific benefits. Click here to access benefits specific to your location. We are committed to providing a fair and accessible hiring process. If you have a disability or other need that requires accommodation or adjustment, please let us know by completing our Applicant Request Support Form or please contact 1-855-833-5120. Criminals may pose as recruiters asking for money or personal information. We never request money or banking details from job applicants. Learn more about spotting and avoiding scams here. Please read our Candidate Privacy Policy. We are an equal opportunity employer: qualified applicants are considered for and treated during employment without regard to race, color, creed, religion, sex, national origin, citizenship status, disability status, protected veteran status, age, marital status, sexual orientation, gender identity, genetic information, or any other characteristic protected by law. USA Job Seekers: EEO Know Your Rights. RELX is a global provider of information-based analytics and decision tools for professional and business customers, enabling them to make better decisions, get better results and be more productive. Our purpose is to benefit society by developing products that help researchers advance scientific knowledge; doctors and nurses improve the lives of patients; lawyers promote the rule of law and achieve justice and fair results for their clients; businesses and governments prevent fraud; consumers access financial services and get fair prices on insurance; and customers learn about markets and complete transactions. Our purpose guides our actions beyond the products that we develop. It defines us as a company. Every day across RELX our employees are inspired to undertake initiatives that make unique contributions to society and the communities in which we operate.">
