    <meta name="description" property="og:description" content="Job Description The Role: We are seeking a creative and highly motivated software engineer eager to learn diverse datasets to build data pipelines, deploy scalable, AI-driven solutions, and create interactive web apps that deliver measurable impacts across GM vehicle engineering and customer experience. Your work will contribute directly to GM vehicle quality and help achieve GM&#39;s vision of a world with ZERO Crashes, ZERO Emissions, and ZERO Congestion The role is in the Vehicle Electronics and Software Execution (VESET) organization. The team is at the forefront of innovation, where vehicle software design, release, warranty, and telemetry data converge to transform engineering and quality processes. We’re pioneering intelligent automation through advanced prognostics powered by smart algorithms, large language models (LLMs), and machine learning driving faster issue resolution and launching vehicles with exceptional quality. What You’ll do: Collaborate with engineers, data scientists, and stakeholders to deliver applications that train and serve machine learning models and create apps that make large datasets available to wider audience. Develop analytics based on wide variety of engineering, program and manufacturing data to develop insights critical to vehicle program launches. Undertake preprocessing of structured and unstructured data. Deploy scalable AI/ML powered analytics and prognostics applications in a cloud environment, driving innovation across vehicle telemetry and software integration domains. Analyze large amounts of diverse information to discover trends and patterns that drive executive decision-making, product launch strategies, and data-driven quality improvements. Present complex information using data visualization techniques and develop UI applications to deliver insights to business clients. Create repeatable and scalable code bases and processes for improving development / execution efficiency. Work with partner teams such as data governance, infrastructure, architecture, and operations on platform management and technology migrations as required. Proactively monitor new trends and technologies and actively seek ways to increase productivity, including using GenAI where appropriate.  Required Qualification: Pursuit of a Bachelor’s or Masters degree in one of the following areas: Computer Science or Data science Must be graduating between December 2026 and August 2027 Proficient in Python Must be able to work in Southeast Michigan Able to work full-time, 40 hours per week Preferred Qualifications: Familiarity with visualization tools (Power BI, Databricks Dashboard) to effectively communicate insights Familiarity with SQL, Databricks in Azure Cloud environment Familiarity with data storage solutions, databases, and data processing framework Ability to translate business questions into data-driven solutions Experience building AI/ML based solutions GM does not provide immigration-related sponsorship for this role. Do not apply for this role if you will need GM immigration sponsorship now or in the future. This includes direct company sponsorship, entry of GM as the immigration employer of record on a government form, and any work authorization requiring a written submission or other immigration support from the company (e.g., H1-B, OPT, STEM OPT, CPT, TN, J-1, etc.) Work Arrangement &amp;amp; Location: Hybrid: This role is categorized as hybrid. This means the successful candidate is expected to report to the office three times per week, at minimum times per week or other frequency dictated by the business. Locations: Warren, Michigan - GM Global Technical Center – Cole Engineering Center Milford, Michigan - General Motors Proving Grounds To help facilitate administration of relocation benefits if you are selected, please apply using the permanent address you would move from. Benefits: GM offers a variety of health and wellbeing benefit programs. Benefit options include medical, dental, vision, Health Savings Account, Flexible Spending Accounts, retirement savings plan, sickness and accident benefits, life insurance, paid vacation &amp;amp; holidays, tuition assistance programs, employee assistance program, GM vehicle discounts and more. This job may be eligible for relocation benefits About GM Our vision is a world with Zero Crashes, Zero Emissions and Zero Congestion and we embrace the responsibility to lead the change that will make our world better, safer and more equitable for all. Why Join Us We believe we all must make a choice every day – individually and collectively – to drive meaningful change through our words, our deeds and our culture. Every day, we want every employee to feel they belong to one General Motors team. Benefits Overview From day one, we&#39;re looking out for your well-being–at work and at home–so you can focus on realizing your ambitions. Learn how GM supports a rewarding career that rewards you personally by visiting Total Rewards resources. Non-Discrimination and Equal Employment Opportunities (U.S.) General Motors is committed to being a workplace that is not only free of unlawful discrimination, but one that genuinely fosters inclusion and belonging. We strongly believe that providing an inclusive workplace creates an environment in which our employees can thrive and develop better products for our customers. All employment decisions are made on a non-discriminatory basis without regard to sex, race, color, national origin, citizenship status, religion, age, disability, pregnancy or maternity status, sexual orientation, gender identity, status as a veteran or protected veteran, or any other similarly protected status in accordance with federal, state and local laws. We encourage interested candidates to review the key responsibilities and qualifications for each role and apply for any positions that match their skills and capabilities. Applicants in the recruitment process may be required, where applicable, to successfully complete a role-related assessment(s) and/or a pre-employment screening prior to beginning employment. To learn more, visit How we Hire. Accommodations General Motors offers opportunities to all job seekers including individuals with disabilities. If you need a reasonable accommodation to assist with your job search or application for employment, email us or call us at 1-800-865-7580. In your email, please include a description of the specific accommodation you are requesting as well as the job title and requisition number of the position for which you are applying. We are leading the change to make our world better, safer and more equitable for all through our actions and how we behave. Learn more about: Our Company Our Culture How we hire Our diverse team of employees bring their collective passion for engineering, technology and design to deliver on our vision of a world with Zero Crashes, Zero Emissions and Zero Congestion. We are looking for adventure-seekers and imaginative thought leaders to help us transform mobility. Explore our global locations We are determined to lead change for the world through technology, ingenuity and harnessing the creativity of our diverse team. Join us to help lead the change that will make our world better, safer and more equitable for all by becoming a member of GM’s Talent Community (beamery.com). As a part of our Talent Community, you will receive updates about GM, open roles, career insights and more. Please note that filling out the form below will not add you to our Talent Community automatically; you will need to use the link above. If you are seeking to apply to a specific role, we encourage you to click “Apply Now” on the job posting of interest.">
