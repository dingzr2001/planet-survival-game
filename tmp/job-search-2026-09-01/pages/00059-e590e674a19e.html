    <meta name="description" property="og:description" content="RELOCATION ASSISTANCE: Relocation assistance may be available CLEARANCE REQUIRED FOR START: No CLEARANCE TYPE: Secret TRAVEL: No Description At Northrop Grumman, our employees have incredible opportunities to work on revolutionary systems that impact people&#39;s lives around the world today, and for generations to come. Our pioneering and inventive spirit has enabled us to be at the forefront of many technological advancements in our nation&#39;s history - from the first flight across the Atlantic Ocean, to stealth bombers, to landing on the moon. We look for people who have bold new ideas, courage and a pioneering spirit to join forces to invent the future, and have fun along the way. Our culture thrives on intellectual curiosity, cognitive diversity and bringing your whole self to work — and we have an insatiable drive to do what others think is impossible. Our employees are not only part of history, they&#39;re making history. Northrop Grumman Defense Systems is a full-spectrum provider of innovative mission critical solutions in aircraft sustainment and modernization, training and simulation, integrated battle command systems, advanced weapons, and software development and IT modernization and sustainment, focused on dynamic mission-sets with quick-turn requirements for a wide variety of national security, military and civilian customers. Defense Systems aspires to be the fastest growing global defense solutions provider, and we deliver a full spectrum of readiness, decision-making, and effects capabilities and solutions. Entry Level opportunities at Northrop Grumman are unique. Are you interested in boosting your knowledge through experience and exposure, while supporting a mission that seeks to protect our nation and its allies? If so, then Northrop Grumman is the place you! Our professionals live and breathe different perspectives; we are curious about the world, accepting each other, and aware that the more ideas, backgrounds, opinions and experiences we bring to our work, the stronger that work will be. Just as you would invest your time and hard work into our company, we focus on investing back into you through enriching professional experiences and high-quality learning and development opportunities. We want you to bring your whole self to work, and for you to have meaningful connections with your coworkers, customers and communities, while providing the best products, systems and technologies to protect our world. Northrop Grumman is seeking Software Engineers . This position will be located at our Defense Systems sector in Huntsville, AL. This requisition may be filled as either an Associate Software Engineer (T01) or an Software Engineer (T02). The qualified candidate will become part of Northrop Grumman’s Strategic Deterrent Systems Division. Roles and Responsiblities: Help create/update system and software-relevant architecture artifacts and ensure the design aligns to constraints (cost/schedule/risk) Help define/analyze requirements, support allocation/traceability, and document the planned verification method for requirements Assist with MBSE tools/methods and integration with other digital engineering tools as required by the program plan/SEMP Basic Qualifications for an Associate Software Engineer (T01): A candidate must meet ALL of the below criteria. The candidate must: Be completing or has completed their bachelor’s degree from an accredited institution. Be majoring in or having majored in Software Engineering, Systems Engineering or Software Development. Be able to obtain a U.S. Government security clearance (U.S. citizenship is a pre-requisite) Basic Qualifications for a Software Engineer (T02): A candidate must meet ALL of the below criteria. The candidate must: Be completing or has completed their master’s degree from an accredited institution. Be majoring in or having majored in Software Engineering, Systems Engineering or Software Development. Be able to obtain a U.S. Government security clearance (U.S. citizenship is a pre-requisite) Preferred Qualifications for both an Associate Software Engineer (T01) &amp;amp; Software Engineer (T02): Have an overall cumulative GPA of 3.70/4.0 or higher Previous internship/co-op or other work experience, leadership &amp;amp; teamwork capabilities, interpersonal communication skills, and activities (professional/community/extracurricular). Salary Range: Associate Software Engineer (T01): 72,700 - 109,100 Software Engineer (T02): 87,600 - 131,400 campusjobs The application period for the job is estimated to be 20 days from the job posting date. However, this timeline may be shortened or extended depending on business needs and the availability of qualified candidates. Northrop Grumman is an Equal Opportunity Employer, making decisions without regard to race, color, religion, creed, sex, sexual orientation, gender identity, marital status, national origin, age, veteran status, disability, or any other protected class. For our complete EEO and pay transparency statement, please visit http://www.northropgrumman.com/EEO. U.S. Citizenship is required for all positions with a government clearance and certain other restricted positions. Existing Applicants: Need to update your contact information or email address? Once logged in, click on Candidate Home in the upper right corner and scroll to the bottom of that screen to see buttons for: Update Contact information to update your legal name, address, and phone number Edit Account Settings to edit your email address We are a pioneering company. With careers across all areas: air, cyber, land, sea and space – our 90,000 employees work as one to defend and define the future. Northrop Grumman careers and internships are as varied as your interests, with a lifetime of potential that will give you every opportunity to do your best work. Working together with people from many backgrounds, personal passions and disciplines, we share a drive to push the boundaries of science, technology and engineering to meet the ever evolving needs of our customers worldwide.">
