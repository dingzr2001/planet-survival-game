    <meta name="description" property="og:description" content="Engineer the future of global finance. At Citi, our Tech team doesn&#39;t just support finance—we are helping to redefine it. Every day, $5 trillion crosses through our network. We do business in 180+ countries operating at a scale few can match. From deploying advanced AI to helping shape global markets, we build systems that matter. Look to join a team where your work helps influence economies, your ideas can drive innovation and outcomes, and your growth is backed by mentorship, continuous learning, and flexibility with potential hybrid work opportunities. Help solve real-world challenges that touch millions and get the opportunity to build the future of finance with Citi Tech. We provide you with the knowledge and skills you need to succeed... We&#39;re committed to teaching you the ropes. For individuals starting their careers, we offer a supportive environment. Here at Citi, internal development paths are intended to help you build a broad skillset and accelerate your career growth by gaining exposure to more than one team in Software Development. Our supportive environment will help you discover the best fit for your skills and long-term career goals at Citi. Your time here will look like this... You will thrive in an agile software development environment, crafting high-quality, scalable software solutions leveraging cutting-edge technologies, including AI-powered coding tools. Translating business requirements into robust code, you&#39;ll ensure adherence to stringent quality standards and provide essential support through testing cycles and post-production deployment. To deliver systems at the enterprise-level that are high quality, scalable, and resilient, you will skillfully utilize advanced tools for code testing and debugging, while learning from top technologists through design sessions and peer code reviews. Furthermore, you&#39;ll benefit from a comprehensive support system: you&#39;ll join a cohort of new hires, embarking on a shared journey to master our company culture, tools, processes, and the technical proficiencies vital to your success. While technologies may vary across teams, and AI tooling is rapidly evolving, developers will gain exposure to a wide range of technologies and tools across all aspects of the SDLC: Back-End Microservices Development: Java, Spring Framework Mobile Development: iOS: Swift, Xcode, MVC Architecture Android: Android Studio, JavaScript, CSS, AJAX, Java Web Services Front-End Web Development: React or Angular, Apigee TypeScript, HTML5 Generative AI &amp;amp; AI Agents: Prompt Engineering, Workflow Design, and GenAI Optimization Tools &amp;amp; Platforms: GitHub Copilot (multiple models), Citi Squad (automated code reviews), Devin.AI (agentic code generation), Stylus Workspaces (in‑house Gemini) Large Language Models (LLMs): Gemini, OpenAI, Claude, Llama, Local Models Frameworks: LangChain, LlamaIndex, Hugging Face Orchestration: LangGraph, Multi-Agent Systems Development Languages: Java, PythonFastAPI Retrieval-Augmented Generation (RAG): PostgreSQL, Vector DBs, Advanced Retrieval ML/DL Frameworks: PyTorch, TensorFlow, Fine-tuning Deployment: Enterprise DevOps Pipeline, Docker, Monitoring Tooling Data Analytics: Utilizing tools like Splunk, Tableau, and Adobe Analytics to track customer journey adoption and measure the business value of delivered products. As an individual contributor, you can expect exposure to: Gen AI Strategy &amp;amp; Cloud Deployment: Contributing to the adoption and deployment of cutting-edge Generative AI models and solutions on diverse cloud providers such as AWS, leveraging specialized AI/ML services for scalable and efficient inference. This includes advanced AI engineering practices to optimize model performance and reliability. Engineering Excellence (AI/MLOps): Adhering to and implementing Citi&#39;s Minimum Development Standards and Minimum Operational Standards, with a strong focus on applying MLOps best practices, ethical AI guidelines, and responsible AI development principles, particularly for managing the lifecycle of Generative AI agents. Architectural Patterns (Gen AI Focus): Exploring and applying the latest design and software architecture patterns and frameworks, including advanced Gen AI model architectures (e.g., Transformers, GANs), prompt engineering patterns, scalable inference solutions, Microservices, APIs, Spring Core/MVC/Boot/Cloud, and RESTful services. This includes designing and building agentic flows for complex business processes. CI/CD &amp;amp; Gen AI Development Tools: Gaining exposure to various software development tools within Continuous Integration/Continuous Delivery pipelines, such as JIRA, Zephyr, GitHub, Harness, Artifactory, MLOps platforms, model versioning tools, AI-specific testing frameworks, and container orchestration platforms like OpenShift. Event Streaming &amp;amp; Messaging (AI Data Pipelines): Working with event streaming and messaging systems, including Kafka, Flink, Solace, or similar technologies, specifically for real-time data ingestion for Gen AI model training, fine-tuning, and inference. Containerization (AI Model Deployment): Hands-on experience with container technologies like Docker and Kubernetes for scalable and reproducible deployment of Gen AI models and related microservices. No matter your team placement, you can expect: Global Gen AI Exposure: Work on globally scoped Generative AI projects with cross-functional teams, gaining invaluable insights into how this transformative technology is reshaping the financial sector worldwide. Continuous Learning &amp;amp; AI Advancement: Benefit from structured learning paths, extensive networking opportunities, mentorship, and development designed to sharpen your technical prowess in Generative AI, enhance your business acumen, and cultivate your leadership skills, staying abreast of the latest advancements in AI research and technologies. This includes gaining expertise in building agents on our proprietary ARC platform. Real Impact with AI: Contribute to real-world projects that shape the future of banking, from developing cutting-edge Generative AI solutions and intelligent automation to strengthening cybersecurity defenses and driving data-powered innovations. We want to hear from you if... We are actively seeking individuals with a profound passion for technology, especially Generative AI, and an unwavering drive to make a significant difference. To join Citi, you should meet the following criteria: Educational Background: Bachelor&#39;s degree in a technology-related discipline (e.g., Computer Science, Computer Engineering, Information Technology, MIS) with a specialization or strong coursework in Artificial Intelligence, Machine Learning, Data Science, or equivalent hands-on experience. Work Authorization: Authorized to work in the United States without the need for employer sponsorship, now OR in the future. Problem-Solving Acumen (AI-driven): A proactive problem-solver who thrives on innovation and embraces challenges with enthusiasm, leveraging Generative AI to address complex business problems and create novel solutions. Global Mindset: Possess a global outlook and a strong willingness to collaborate effectively across diverse cultures and time zones, understanding the global implications of AI development. Communication &amp;amp; Leadership: Demonstrate excellent communication skills, project management capabilities, leadership potential, keen attention to detail, and the ability to excel within diverse teams, particularly in articulating complex AI concepts. Technical Proficiency (Gen AI): Capable of successfully passing technical interviews, including basic algorithmic programming exercises, with demonstrated proficiency in Generative AI frameworks (e.g., TensorFlow, PyTorch, Hugging Face), model development, prompt engineering, and understanding of AI architecture. Strong experience in AI engineering, particularly in building agentic flows and building agents on our proprietary ARC platform, is highly valued. Collaboration &amp;amp; Adaptability: Must be collaborative and adaptable, with prior experience working on agile teams being highly desirable, especially in a fast-paced environment delivering AI solutions. Who we think will be a great fit... A steadfast dedication to continuous learning in Generative AI and a genuine passion for applying AI in business are paramount. As global industries continue to evolve, we are seeking professionals who bring a global perspective to the future of banking and are eager to make an impact at the corporate level using AI. We champion diversity, and we expect you to share that value. This role is ideally suited for individuals who: Are ambitious, with a relentless drive to succeed in a fast-paced, dynamic environment. Are inherently curious about how Generative AI can revolutionize finance and are eager to be at the forefront of this transformation. Aspire to grow into a future Gen AI leader, combining a passion for AI with its strategic application within the global financial industry. ------------------------------------------------------ Job Family Group: Technology ------------------------------------------------------ Job Family: Applications Development ------------------------------------------------------ Time Type: Full time ------------------------------------------------------ Primary Location: New York New York United States ------------------------------------------------------ Primary Location Full Time Salary Range: $95,770.00 - $133,630.00 In addition to salary, Citi’s offerings may also include, for eligible employees, discretionary and formulaic incentive and retention awards. Citi offers competitive employee benefits, including: medical, dental &amp;amp; vision coverage; 401(k); life, accident, and disability insurance; and wellness programs. Citi also offers paid time off packages, including planned time off (vacation), unplanned time off (sick leave), and paid holidays. For additional information regarding Citi employee benefits, please visit citibenefits.com. Available offerings may vary by jurisdiction, job level, and date of hire. ------------------------------------------------------ Most Relevant Skills Please see the requirements listed above. ------------------------------------------------------ Other Relevant Skills For complementary skills, please see above and/or contact the recruiter. ------------------------------------------------------ Anticipated Posting Close Date: Sep 07, 2026 ------------------------------------------------------ Automated Processing and AI We use automated processing, including artificial intelligence, for our legitimate business interests (or our reasonable and appropriate business purposes) to identify and align the candidate&#39;s skills and abilities with a specific job opening. Additionally, if you so choose, or consent, we can match your skills and abilities to other suitable roles at Citi. Importantly, all our hiring processes and decisions, including determining your suitability for a role, are conducted, checked, and decided by individuals. Our automated processing and AI do not involve relying on automatic or autonomous decision-making. Please refer to any Jurisdictional Considerations, with specific provisions for your country (where relevant) for further details. Illinois residents – AI Notice and Right ------------------------------------------------------ Citi is an equal opportunity employer, and qualified candidates will receive consideration without regard to their race, color, religion, sex, sexual orientation, gender identity, national origin, disability, status as a protected veteran, or any other characteristic protected by law. If you are a person with a disability and need a reasonable accommodation to use our search tools and/or apply for a career opportunity review Accessibility at Citi. View Citi’s EEO Policy Statement and the Know Your Rights poster.">
