  <meta name="description" content="ABOUT ZIP

Zip is the AI platform for enterprise procurement — built for humans and agents working together. By orchestrating procurement across teams, tools, and suppliers with the help of AI agents, companies can secure the resources they need to innovate faster than ever before.

The world’s most influential enterprises trust Zip, including T-Mobile, OpenAI, AMD, Mars, Dollar Tree, and more. Together they’ve saved over $8 billion and processed over $500 billion in spend. Zip’s team includes product leaders from Apple, Airbnb, and Meta, as well as former procurement leaders from United Health, Sanofi, MGM Resorts, Discover, and NASA.

Backed by Adams Street, Alkeon, BOND, CRV, DST, Tiger Global, and Y Combinator, Zip has raised $371 million, most recently at a $2.2 billion valuation and has been recognized by Forbes Fintech 50, Fast Company&#39;s Most Innovative Companies, Inc. Best in Business, and LinkedIn Top Startups.


YOUR ROLE

As a New Grad Software Engineer you will be responsible for building Zip’s core products and architecture. You will ship features that will be immediately used by our customers, and will work with a tight-knit team that values open communication and cross-functional collaboration. We move quickly to solve a wide range of complex technical and product challenges. While we are an experienced team that can provide constant guidance and mentorship, we value engineers who can scope and solve difficult technical challenges.


YOU WILL

 - Design and build highly reliable and resilient products and features

 - Work closely with cross functional product and customer-facing teams to understand requirements and ship thoughtful solutions

 - Write high-quality, extensible, and maintainable code

 - Design and build scalable frontend applications and components

 - Design and build APIs to drive existing and new features for a web-based application


QUALIFICATIONS

 - Pursuing a BS or MS in Computer Science, Computer Engineering, or related technical field involving coding (e.g. physics or math)

 - Graduating between December 2026 and June 2027

 - Ability to work on-site at our San Francisco HQ (hybrid schedule)

 - Experience with web applications and API development. At Zip, our stack includes Python, Javascript/TypeScript, React, and GraphQL

 - Ability and interest to quickly learn new frameworks, architecture patterns, and programming languages as needed

 - Fantastic written and verbal communication skills

 - Prior internship experience at a high-growth startup or leading tech company, in a dynamic, fast-moving environment

The salary range for this role is $165,000 - $170,000. The salary for this position is determined based on a variety of job-related factors that may include location, relevant experience, education, or particular skills and expertise. Relocation assistance may be available for qualified candidates.


PERKS &amp; BENEFITS

At Zip, we’re committed to providing our employees with everything they need to do their best work.

 - 📈  Start-up equity

 - 🦷  100% health, vision &amp; dental coverage options

 - 🍽️  Catered breakfast, lunch, &amp; dinner

 - 🌴 Flexible PTO

 - 🏋️‍♀️ ClassPass membership

 - 🚍  Monthly commuter benefit

 - 🚠  Team building events &amp; happy hours

 - 💻  Home office stipend

 - 🛜 Phone/internet reimbursement

 - 🍼 Paid parental leave

 - 🧑‍🧑‍🧒‍🧒 Fertility stipend

 - 💸  401k plan

 - 🤖 Unlimited AI token usage

We&#39;re looking to hire Zipsters and that means hiring people who take ownership, communicate openly, have an underdog mindset, and are excited to increase the pace of innovation for every business in the world. We encourage all candidates to apply even if your experience doesn&#39;t exactly match up to our job description. We are committed to building a diverse and inclusive workspace where everyone (regardless of age, religion, ethnicity, gender, sexual orientation, and more) feels like they belong. We look forward to hearing from you!" />
