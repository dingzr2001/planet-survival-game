    <meta name="description" property="og:description" content="Job Description: Our Opportunity: Chewy is hiring a Software Engineer I for our WIZMO engineering team in Seattle, WA. This team builds and supports services that power Chewy’s post-purchase customer experience, helping customers understand the status of their orders and receive accurate, timely information throughout the fulfillment and delivery lifecycle. As part of the team, you will work on customer-facing and backend capabilities that integrate with fulfillment, transportation, carrier, and other Chewy systems. This role provides an opportunity to develop strong software engineering skills while contributing to highly available services that operate at Chewy scale. Strong computer science fundamentals will be valuable in this role, including object-oriented design, data structures, algorithms, problem solving, and understanding system behavior. Experience with a statically typed programming language such as Java, Kotlin, Scala, or similar languages will help set you up for success. What you&#39;ll do: In this role, you will design, develop, test, deploy, and support backend services and APIs that power Chewy&#39;s WIZMO and post-purchase experiences. You will contribute to roadmap initiatives that improve customer order visibility, carrier integrations, and fulfillment-related capabilities. You will build reliable software, improve testing coverage, and help enhance the scalability, observability, and reliability of production services. You will also participate in code reviews, technical discussions, and operational support, including on-call responsibilities, while collaborating with engineers, product managers, and partner teams across Chewy. What you&#39;ll need: Bachelor’s degree in computer science or related field (or equivalent work experience) Experience in a statically typed general purpose programming languages such as Java, Scala, Kotlin, C#, Swift, Objective-C, GO Knowledge of professional software engineering practices for the full software development life cycle including coding standards, code reviews, source control management, build processes, testing, and operations Strong Computer Science fundamentals: object oriented design, data structures, algorithm design, problem solving, and complexity analysis SQL and RDBMS experience Sharp analytical abilities and proven design skills Work in an agile development environment, collaborating with Application Development and Architecture teams. Strong analytical and troubleshooting skills Experience with designing, building and deploying scalable, highly available systems Strong communication skills as well as experience in mentoring and educating your peers Preferred Skills: Experience developing backend applications or services using Java, Kotlin, or similar technologies. Experience working with Service Oriented Architecture including REST APIs, gRPC, or other service-to-service communication patterns. Familiarity with asynchronous or event-driven programming patterns, especially in the context of AWS Services, such as S3, EC2, Lambda, SQS, or similar cloud infrastructure tools. Experience in multiple programming paradigms Experience in working in the business domain of e-commerce. Familiarity with monitoring, logging, metrics, and application observability Experience with automated integration or end-to-end testing. Hibernate / jdbc experience, Postgres, Vertica, Aerospike Experience working in an agile environment (Scrum, XP or etc.) Experience in web technologies such as ES6, Reactive MVC / MVVM Framework, HTML5, Spring Framework The base salary range for this role is $97,500 - $160,000.00. The specific salary offered to a candidate may be influenced by a variety of factors including but not limited to the candidate’s relevant experience, education, and work location. In addition, this position is eligible for 401k and a new hire and annual equity grant. C08+ positions may also be eligible for annual bonus. We offer different types of insurance and benefits, such as medical/Rx, vision, dental, life, disability, hospital indemnity, critical illness, and accident. We offer parental leave, family services benefits, backup dependent care, flexible spending accounts, telemedicine, pet adoption reimbursement, employee assistance program, and many discounts including 10% off pet insurance and 20% off at Chewy.com. Exempt salary team members have unlimited PTO, subject to manager approval. Team members will receive six paid holidays per year. Team members may be eligible for paid sick and family leave in compliance with applicable state and local regulations. Chewy is an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, ancestry, national origin, gender, citizenship, marital status, religion, age, disability, gender identity, results of genetic testing, veteran status, as well as any other legally-protected characteristic. If you have a disability under the Americans with Disabilities Act or similar law, and you need an accommodation during the application process or to perform these job requirements, or if you need a religious accommodation, please contact CAAR@chewy.com. To access Chewy&#39;s California CPRA Job Applicant Privacy Policy, please click here. Watch Here At Chewy, our mission is to be the most trusted and convenient destination for pet parents and partners, everywhere. Rooted in our mission to be the most trusted and convenient destination for pet parents and partners, everywhere, we’re guided by our Chewy Operating Principles (or OPs for short), which serve as a common framework that drives our character, capabilities, ingenuity and operations. Our 10 Operating Principles guide us every day: • Customers First • Deliver Results • Earn Trust • Accelerate Time • Act as an Owner • Debate Openly; Commit Fully • Build High-Performing Teams • Keep it Simple • Think Big">
