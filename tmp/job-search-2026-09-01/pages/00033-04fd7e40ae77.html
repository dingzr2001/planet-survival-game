    <title>Software Engineer, AI &amp; Data Systems @ Clera</title><meta name="title" content="Software Engineer, AI &amp; Data Systems @ Clera" />
    
  
  <meta name="description" content="ABOUT THE ROLE

Join a small, high-ownership engineering team at a seed-stage people data and AI infrastructure company building one of the world&#39;s largest real-time identity graphs. You&#39;ll work across backend, data, and infrastructure surfaces to ship customer-facing products and core platform capabilities — taking ambiguous problems all the way from concept to production.


WHAT YOU&#39;LL DO

 - Build and ship customer-facing products and platform capabilities spanning backend services, data infrastructure, and frontend surfaces.

 - Design and operate high-volume data pipelines and services at massive scale with a strong focus on reliability, security, and observability.

 - Build AI agents, agent harnesses, and developer tooling — then own and operate them reliably in production at scale.

 - Make architecture decisions, articulate tradeoffs clearly, and iterate designs as requirements evolve.

 - Work directly with founders and customers to translate vague requests into clear product decisions and working software.


WHAT WE&#39;RE LOOKING FOR

 - 1–6 years of software engineering experience, ideally at an early-stage startup (seed through Series A/B) shipping across both product and infrastructure.

 - Demonstrated end-to-end ownership of a production system — from initial concept through deployment and ongoing operations.

 - Strong backend engineering fundamentals: APIs, data modeling, and distributed systems.

 - Hands-on experience building and operating high-volume data pipelines.

 - Strong CS fundamentals, preferably from a rigorous academic background.

 - Experience with AI-native development: LLMs, agent frameworks, and AI agent systems.

 - Familiarity with identity resolution, data enrichment, or entity-matching systems is a plus.

 - Comfortable using modern AI development tools aggressively while maintaining sound engineering judgment.

 - Available to start by mid-September 2026.


COMPENSATION &amp; BENEFITS

Salary range: $200,000 – $280,000 USD annually. Visa sponsorship is not available for this role.


LOCATION

This is a full-time, on-site role based in San Francisco, California." />
