    <meta name="description" property="og:description" content="The Associate Software Engineer is responsible for all stages of the software development lifecycle using a variety of technologies and tools to build impactful software solutions. The scope of this job includes building and optimizing comprehensive solutions that prioritize end-user efficiency and experience. Key Responsibilities: Develop and maintain features and components of WellSky solutions with an emphasis on code quality and performance. Work closely with solution managers, designers, and other engineering teams to understand requirements and deliver high-quality, user-focused solutions. Investigate and resolve bugs and issues within the application, and collaborate with the team to identify root causes and ensure timely resolution. Develop and maintain a robust set of unit tests and participate in other styles of automated testing, including integration, load, and performance testing to validate quality of code written. Stay current with the latest industry trends, including AI technologies and tools to improve the development process. Leverage AI tools and platforms as an integral part of daily responsibilities to enhance decision-making, streamline workflows, and drive data-informed outcomes. Perform other job duties as assigned. Required Qualifications:   Bachelor&#39;s degree in a related field or equivalent work experience 0 - 2 years related work experience Effective written and verbal communication skills, with the ability to collaborate across cross-functional teams Eagerness to learn new technologies and adapt to evolving project requirements in a fast-paced environment Working knowledge of Agile/Scrum methodologies, including sprint planning, daily stand-ups, backlog grooming, and retrospectives Foundational experience with web application development, including a solid understanding of HTTP, client-server architecture, and responsive design principles Strong analytical and problem-solving skills with attention to detail and code quality Proficiency in C# and object-oriented programming concepts Exposure to Angular or another modern front-end framework for building component-based user interfaces Understanding of relational database concepts, including SQL querying, schema design, and basic performance considerations   Preferred Qualifications:      Healthcare industry experience Experience designing, consuming, or testing RESTful APIs and understanding of API integration patterns Familiarity with AI concepts or tools (for example, using AI coding assistants, prompt engineering, or exposure to applying AI/ML models in application features) is a plus Job Expectations: Willing to work additional or irregular hours as needed Must work in accordance with applicable security policies and procedures to safeguard company and client information Must be able to sit and view a computer screen for extended periods of time #LI-TC1 #LI-Onsite WellSky is where independent thinking and collaboration come together to create an authentic culture. We thrive on innovation, inclusiveness, and cohesive perspectives. At WellSky you can make a difference. Here are some of the exciting benefits full-time teammates are eligible to receive at WellSky: Excellent medical with Rx, dental, and vision benefits Mental Health support through EAP Generous paid time off, plus 13 paid holidays 100% vested 401(K) retirement plans Educational assistance up to $2500 per year WellSky provides equal employment opportunities to all people without regard to race, color, national origin, ancestry, citizenship, age, religion, gender, sex, sexual orientation, gender identity, gender expression, marital status, pregnancy, physical or mental disability, protected medical condition, genetic information, military service, veteran status, or any other status or characteristic protected by law. WellSky is proud to be a drug-free workplace. Applicants for U.S.-based positions with WellSky must be legally authorized to work in the United States. Verification of employment eligibility will be required at the time of hire. Certain client-facing positions may be required to comply with applicable requirements, such as immunizations and occupational health mandates. Data Privacy Notice for Job Applicants and Teammates WellSky is a technology company leading the movement for intelligent, coordinated care worldwide. Our next-level software, analytics, and services power better outcomes and lower costs for stakeholders across the health and community care continuum. In today’s value-based care environment, WellSky helps providers, payers, health systems, and community organizations solve tough challenges, improve collaboration for growth, harness the power of data analytics, and achieve better outcomes by further connecting clinical and social care.">
