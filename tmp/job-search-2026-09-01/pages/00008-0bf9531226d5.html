  <meta name="description" content="ABOUT US

At Sierra, we’re building a platform to enable every company in the world to build better, more human customer experiences with AI. We partner with industry leaders such as SoftBank, Uber, Rivian, CLEAR, and Sutter Health. We are primarily an in-person company based in San Francisco, with growing offices across North America, Europe, and Asia.

We are guided by a set of values that are at the core of our actions and define our culture: Trust, Customer Obsession, Craftsmanship, Intensity, and Family. These values are the foundation of our work, and we are committed to upholding them in everything we do.

Our co-founders are Bret Taylor https://www.linkedin.com/in/brettaylor/ and Clay Bavor https://www.linkedin.com/in/claybavor/. Bret currently serves as Board Chair of OpenAI. Previously, he was co-CEO of Salesforce (which had acquired the company he founded, Quip) and CTO of Facebook. Bret was also one of Google&#39;s earliest product managers and co-creator of Google Maps. Before founding Sierra, Clay spent 18 years at Google, where he most recently led Google Labs. Earlier, he started and led Google’s AR/VR effort, Project Starline, and Google Lens. Before that, Clay led the product and design teams for Google Workspace. 


WHAT YOU’LL DO

 - Design and deliver production-grade AI agents https://sierra.ai/blog/meet-the-ai-agent-engineer: You&#39;ll build and ship highly performant, reliable, and intuitive AI agents that are central, mission-critical and drive revenue directly to Sierra&#39;s growth. These aren&#39;t prototypes—they are powerful, scalable systems running in production environments across industries like finance, healthcare, and commerce.

 - Drive the Agent Development Life Cycle https://sierra.ai/blog/agent-development-life-cycle (ADLC): You&#39;ll have complete ownership and autonomy from initial pilot through deployment and continuous iteration. You&#39;ll be responsible for building, tuning, and evolving AI agents in production environments, defining the standard for ADLC best practices along the way.

 - Partner with large enterprises and cutting-edge startups: You’ll work directly with leaders at some of the world’s largest enterprises to understand their most pressing business challenges, and build AI agents that transform how they operate at scale. You&#39;ll also partner with the most cutting-edge startups in Silicon Valley, embedding AI agents across their entire business stack to drive innovation and efficiency.

 - Build the future of the platform: Your direct work with customers will guide the evolution of Sierra&#39;s core platform. You&#39;ll surface unmet needs, prototype new tools and features, and collaborate with research, product, and platform to shape the future of AI agent development and Sierra&#39;s product.


EXAMPLE PROJECTS

These are some examples of projects that engineers on our team have worked on recently:

 - Design and build AI agents for large telecommunications and media companies that consistently outperform human agents in managing subscription churn

 - Develop and refine AI agents capable of navigating complex customer interactions, like troubleshooting a broken device and personalizing product recommendations

 - Create generalizable AI agent frameworks tailored for industry-specific use cases. See some examples in our financial services blog https://sierra.ai/blog/five-ways-to-use-ai-agents-financial-services!

 - Facilitate design partnerships for new product initiatives, such as new agent architectures, self-service capabilities, and generative agent development

 - Experiment with the latest voice models and figure out how to integrate them at scale to enterprise-grade customers


WHAT YOU&#39;LL BRING

 - Experience building and scaling end-to-end production systems

 - Strong technical problem-solving skills, especially in fast-changing, ambiguous environments

 - A builder and tinkerer’s mindset with high agency - you find creative ways to overcome obstacles and ship

 - Comfort working directly with customers to understand their needs and solve real-world problems

 - Excellent communication skills - clear, direct, and persuasive across technical and non-technical audiences


EVEN BETTER...

 - Experience building or deploying AI/LLM systems in production

 - Have been a founder or founding engineer - you know what it means to balance craft, ownership, and speed

 - Familiarity with tools that power today&#39;s AI agents: eval frameworks, agent tooling, RAG pipelines, and prompt engineering

 - Prior experience with React, TypeScript, and/or Go

 - Previous roles where you interfaced with customers or led technical projects with external stakeholders


OUR VALUES

 - Trust: We build trust with our customers with our accountability, empathy, quality, and responsiveness. We build trust in AI by making it more accessible, safe, and useful. We build trust with each other by showing up for each other professionally and personally, creating an environment that enables all of us to do our best work.

 - Customer Obsession: We deeply understand our customers’ business goals and relentlessly focus on driving outcomes, not just technical milestones. Everyone at the company knows and spends time with our customers. When our customer is having an issue, we drop everything and fix it.

 - Craftsmanship: We get the details right, from the words on the page to the system architecture. We have good taste. When we notice something isn’t right, we take the time to fix it. We are proud of the products we produce. We continuously self-reflect to continuously self-improve.

 - Intensity: We know we don’t have the luxury of patience. We play to win. We care about our product being the best, and when it isn’t, we fix it. When we fail, we talk about it openly and without blame so we succeed the next time.

 - Family: We know that balance and intensity are compatible, and we model it in our actions and processes. We are the best technology company for parents. We support and respect each other and celebrate each other’s personal and professional achievements.


WHAT WE OFFER

We want our benefits to reflect our values and offer the following to full-time employees:

 - Flexible (unlimited) paid time off

 - Medical, dental, and vision benefits for you and your family

 - Life insurance and disability benefits

 - Retirement plan dependent on country of employment

 - Parental leave

 - Fertility and family building benefits through Carrot

 - Lunch, as well as delicious snacks and coffee to keep you energized 

 - Discretionary benefit stipend giving people the ability to spend where it matters most

 - Free alphorn lessons

These benefits are further detailed in Sierra&#39;s policies, may vary by region, and are subject to change at any time, consistent with the terms of any applicable compensation or benefits plans. Eligible full-time employees can participate in Sierra&#39;s equity plans subject to the terms of the applicable plans and policies.


BE YOU, WITH US

We&#39;re working to bring the transformative power of AI to every organization in the world. To do so, it is important to us that the diversity of our employees represents the diversity of our customers. We believe that our work and culture are better when we encourage, support, and respect different skills and experiences represented within our team. We encourage you to apply even if your experience doesn&#39;t precisely match the job description. We strive to evaluate all applicants consistently without regard to race, color, religion, gender, national origin, age, disability, veteran status, pregnancy, gender expression or identity, sexual orientation, citizenship, or any other legally protected class." />

er’s personal and professional achievements.</p></li></ul><h2><strong>What we offer</strong></h2><p style=\"min-height:1.5em\">We want our benefits to reflect our values and offer the following to full-time employees:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Flexible (unlimited) paid time off</p></li><li><p style=\"min-height:1.5em\">Medical, dental, and vision benefits for you and your family</p></li><li><p style=\"min-height:1.5em\">Life insurance and disability benefits</p></li><li><p style=\"min-height:1.5em\">Retirement plan dependent on country of employment</p></li><li><p style=\"min-height:1.5em\">Parental leave</p></li><li><p style=\"min-height:1.5em\">Fertility and family building benefits through Carrot</p></li><li><p style=\"min-height:1.5em\">Lunch, as well as delicious snacks and coffee to keep you energized </p></li><li><p style=\"min-height:1.5em\">Discretionary benefit stipend giving people the ability to spend where it matters most</p></li><li><p style=\"min-height:1.5em\">Free alphorn lessons</p></li></ul><p style=\"min-height:1.5em\">These benefits are further detailed in Sierra's policies, may vary by region, and are subject to change at any time, consistent with the terms of any applicable compensation or benefits plans. Eligible full-time employees can participate in Sierra's equity plans subject to the terms of the applicable plans and policies.</p><h2><strong>Be you, with us</strong></h2><p style=\"min-height:1.5em\">We're working to bring the transformative power of AI to every organization in the world. To do so, it is important to us that the diversity of our employees represents the diversity of our customers. We believe that our work and culture are better when we encourage, support, and respect different skills and experiences represented within our team. We encourage you to apply even if your experience doesn't precisely match the job description. We strive to evaluate all applicants consistently without regard to race, color, religion, gender, national origin, age, disability, veteran status, pregnancy, gender expression or identity, sexual orientation, citizenship, or any other legally protected class.</p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Sierra","value":"149f368c-52d5-408f-ba26-ad888f318a00"},"datePosted":"2026-08-31","hiringOrganization":{"@type":"Organization","name":"Sierra","sameAs":"https://sierra.ai/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/cd8cfc6f-ebfb-4f49-8ed3-435ef32e4044/f60eead5-66f3-4298-8d6c-c23fa7a80378/20c7459b-7643-4f12-be10-c4005d370dff.png"},"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"CA","addressCountry":"United States"}},{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"New York","addressRegion":"New York","addressCountry":"United States"}}],"employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":150000,"maxValue":180000,"unitText":"YEAR"}}}</script>

g technical problem-solving skills, especially in fast-changing, ambiguous environments</p></li><li><p style=\"min-height:1.5em\">A builder and tinkerer’s mindset with high agency - you find creative ways to overcome obstacles and ship</p></li><li><p style=\"min-height:1.5em\">Comfort working directly with customers to understand their needs and solve real-world problems</p></li><li><p style=\"min-height:1.5em\">Excellent communication skills - clear, direct, and persuasive across technical and non-technical audiences</p></li></ul><h2><strong>Even better...</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience building or deploying AI/LLM systems in production</p></li><li><p style=\"min-height:1.5em\">Have been a founder or founding engineer - you know what it means to balance craft, ownership, and speed</p></li><li><p style=\"min-height:1.5em\">Familiarity with tools that power today's AI agents: eval frameworks, agent tooling, RAG pipelines, and prompt engineering</p></li><li><p style=\"min-height:1.5em\">Prior experience with React, TypeScript, and/or Go</p></li><li><p style=\"min-height:1.5em\">Previous roles where you interfaced with customers or led technical projects with external stakeholders</p></li></ul><h2><strong>Our values</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Trust: </strong>We build trust with our customers with our accountability, empathy, quality, and responsiveness. We build trust in AI by making it more accessible, safe, and useful. We build trust with each other by showing up for each other professionally and personally, creating an environment that enables all of us to do our best work.</p></li><li><p style=\"min-height:1.5em\"><strong>Customer Obsession: </strong>We deeply understand our customers’ business goals and relentlessly focus on driving outcomes, not just technical milestones. Everyone at the company knows and spends time with our customers. When our customer is having an issue, we drop everything and fix it.</p></li><li><p style=\"min-height:1.5em\"><strong>Craftsmanship: </strong>We get the details right, from the words on the page to the system architecture. We have good taste. When we notice something isn’t right, we take the time to fix it. We are proud of the products we produce. We continuously self-reflect to continuously self-improve.</p></li><li><p style=\"min-height:1.5em\"><strong>Intensity: </strong>We know we don’t have the luxury of patience. We play to win. We care about our product being the best, and when it isn’t, we fix it. When we fail, we talk about it openly and without blame so we succeed the next time.</p></li><li><p style=\"min-height:1.5em\"><strong>Family: </strong>We know that balance and intensity are compatible, and we model it in our actions and processes. We are the best technology company for parents. We support and respect each other and celebrate each other’s personal and professional achievements.</p></li></ul><h2><strong>What we offer</strong></h2><p style=\"min-height:1.5em\">We want our benefits to reflect our values and offer the following to full-time employees:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Flexible (unlimited) paid time off</p></li><li><p style=\"min-height:1.5em\">Medical, dental, and vision benefits for you and your family</p></li><li><p style=\"min-height:1.5em\">Life insurance and disability benefits</p></li><li><p style=\"min-height:1.5em\">Retirement plan dependent on country of employment</p></li><li><p style=\"min-height:1.5em\">Parental leave</p></li><li><p style=\"min-height:1.5em\">Fertility and family building benefits through Carrot</p></li><li><p style=\"min-height:1.5em\">Lunch, as well as delicious snacks and coffee to keep you energized </p></li><li><p style=\"min-height:1.5em\">Discretionary benefit stipend giving people the ability to spend where it matters most</p></li><li><p style=\"min-height:1.5em\">Free alphor
