    <meta name="description" property="og:description" content="Silicon Labs (NASDAQ: SLAB) is the leading innovator in low-power wireless connectivity, building embedded technology that connects devices and improves lives. Merging cutting-edge technology into the world’s most highly integrated SoCs, Silicon Labs provides device makers the solutions, support, and ecosystems needed to create advanced edge connectivity applications. Headquartered in Austin, Texas, Silicon Labs has operations in over 16 countries and is the trusted partner for innovative solutions in the smart home, industrial IoT, and smart cities markets. Learn more at www.silabs.com. DevOps Platform Engineer Austin, TX Meet the Team You’ll join the Silicon Labs DevOps Platform team in Austin, working alongside colleagues in the United States and India to support the infrastructure and shared services that power our engineering organization. The team manages primarily on-premises services alongside AWS cloud infrastructure, with a focus on developer productivity, automation, operational reliability, and internal platform development. This early-career role offers hands-on experience with production systems and widely used infrastructure technologies. You’ll contribute to daily platform operations and project-based improvements while learning from experienced engineers in a collaborative environment that values ownership, reliability, and continuous improvement. Responsibilities Develop and manage shared platform services used by engineering teams. Contribute to CI/CD pipelines, engineering workflows, observability, and service reliability. Build and maintain scripts, tools, and automation that reduce manual effort and improve platform consistency. Partner with internal stakeholders to support new capabilities and evolving engineering workflows. Monitor and support infrastructure across on-premises and AWS environments. Investigate incidents, respond to alerts, and collaborate with senior engineers on root-cause analysis and remediation. Participate in a 24/7 follow-the-sun on-call rotation shared between teams in the United States and India. Create and maintain technical documentation, support guides, and operational runbooks. Skills You Need Minimum Qualifications Bachelor’s degree in Computer Science, Engineering, Information Systems, or a related field, or equivalent practical experience. One to three years of relevant experience, which may include internships, co-ops, apprenticeships, or early full-time roles. Working knowledge of Linux systems, networking fundamentals, and infrastructure troubleshooting. Familiarity with at least one scripting or programming language, such as Python, Go, or Bash. Exposure to containers, CI/CD, cloud infrastructure, or systems automation. Ability to troubleshoot methodically, escalate issues appropriately, and communicate clearly across teams. Interest in operational excellence, systems reliability, automation, and continuous improvement. The following skills will be considered a plus: Experience with Kubernetes in an academic, lab, internship, or professional environment. Familiarity with AWS services such as IAM, EC2, VPC, S3, CloudWatch, or EKS. Exposure to Jenkins, GitHub Actions, or another CI/CD platform. Familiarity with Grafana, Prometheus, logging tools, or general observability practices. Experience writing automation for deployment, configuration, or operational tasks. Benefits &amp;amp; Perks You can look forward to the following benefits: Great medical (Choice of PPO or Consumer Driven Health Plan with HSA), dental and vision plans Highly competitive salary 401k plan with match and Roth plan option Equity rewards (RSUs) Life/AD&amp;amp;D and disability coverage Flexible spending accounts Adoption assistance Back-Up childcare Additional benefit options (Commuter benefits, Legal benefits, Pet insurance) Flexible PTO schedule 3 paid volunteer days per year Tuition reimbursement Free downtown parking Onsite gym Monthly wellness offerings Free snacks Monthly company updates with our CEO #LI-MA1 #LI-Hybrid The annualized base pay range for this role is expected to be between $66,500 - $123,500 USD. Actual base pay could vary based on factors including but not limited to experience, geographic location where work will be performed and applicant’s skill set. The base pay is just one component of the total compensation package for employees. Other rewards may include an annual cash bonus, equity package and a comprehensive benefits package. Silicon Labs is an equal opportunity employer and values the diversity of our employees. Employment decisions are made on the basis of qualifications and job-related criteria without regard to race, religion, color, national origin, gender, sexual orientation, age, marital status, veteran status, or disability status, or any other characteristic protected by applicable law. At Silicon Labs, we hire and empower great talent to achieve their full potential. By offering challenging projects, technical mentorship, and continuous learning opportunities, we ensure our employees thrive at every stage of their careers. Here, you’ll work alongside some of the industry’s brightest minds, tackling complex problems that deepen your expertise and expand your horizons. Whether you’re building new skills or shaping your career path, we’re dedicated to supporting your growth and celebrating your success every step of the way. Please note that our Company never asks for personal information unrelated to the job application process, such as bank or credit card data and never charges any fees to apply to any jobs. For more information please click here.">
