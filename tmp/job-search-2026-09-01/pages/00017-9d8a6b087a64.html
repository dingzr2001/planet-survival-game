    <meta name="title" property="og:title" content="Software Engineer I (Hybrid) Arlington, VA &amp;amp; Cambridge, MA">
    <meta name="description" property="og:description" content="Date Posted: 2026-09-01 Country: États-Unis d&#39;Amérique Location: US-VA-ARLINGTON-111 ~ 1300 17Th St N ~ BBN ARLINGTON Position Role Type: Hybrid U.S. Citizen, U.S. Person, or Immigration Status Requirements: The ability to obtain and maintain a U.S. government issued security clearance is required. U.S. citizenship is required, as only U.S. citizens are eligible for a security clearance Security Clearance Type: DoD Clearance: Top Secret Security Clearance Status: Active and existing security clearance required after day 1 At RTX, the world&#39;s largest aerospace and defense company, 185,000 great minds are united by purpose and inspired to make a difference solving the world’s most complex problems. With our three market leading businesses, world-class operations and investments in research and development, we offer capabilities and opportunity no one else can. Together, we push the boundaries of known science and find new ways to connect and protect our world. Join us and help shape the future of aerospace and defense. What You Will Do: RTX BBN’s Analytics and Machine Intelligence department (AMI) is seeking current seniors or recent undergraduate/master’s students for a Research Engineer role focused on AI/ML, with a particular interest in Generative AI (GenAI) and Agentic AI systems. This role is in our Arlington, VA and Cambridge, MA offices. In this role, you will work with researchers and engineers to design, build, test, and transition AI capabilities for real-world applications. We are looking for candidates with strong software fundamentals, curiosity about modern AI systems, and an interest in applying emerging techniques to challenging mission and commercial problems. As a successful candidate, you will contribute to projects spanning the full development lifecycle, including prototyping, implementation, evaluation, and deployment into operational environments. Example areas include LLM-based agentic AI systems, retrieval and reasoning workflows, tool-using agents, ML engineering pipelines, and applied research for high-impact use cases. Qualifications You Must Have: Bachelor’s degree in Electrical Engineering, Computer Engineering or related Science, Technology, Engineering or Mathematics (STEM) major obtained by start date. Proficiency in Java, Python, and/or C++ Strong problem solving and analytical skills Excellent written and verbal communication skills Ability to problem solve and autonomously troubleshoot Ability to work in a team environment and collaborate with multiple scientists and engineers Qualifications We Prefer: Prior RTX internship, co-op, or work experience. Academic or project experience in AI/ML, data science, or generative AI Interest in AI/ML, GenAI, Agentic AI systems, and/or Data Science Experience and/or interest in agentic AI systems, such as tool-using LLMs, orchestration workflows, evaluation/benchmarking, or retrieval-augmented systems Familiarity with ML development workflows, including experimentation, model evaluation, and pipeline development Exposure to frameworks like LangChain, LangGraph, Autogen, or similar ecosystems Knowledge of, experience in, or interest in learning about the aerospace, defense, and intelligence community What We Offer: Our values drive our actions, behaviors, and performance with a vision for a safer, more connected world. At RTX we value: Trust, Respect, Accountability, Collaboration, and Innovation. Relocation Eligibility Learn More &amp;amp; Apply Now Please ensure the role type defined below is appropriate for your needs before applying to this role. This position is classified as: Hybrid: Employees who are working in Hybrid roles will work regularly both onsite and offsite. Ratio of time working onsite will be determined in partnership with your leader. As part of our commitment to maintaining a secure hiring process, candidates may be asked to attend select steps of the interview process in-person at one of our office locations, regardless of whether the role is designated as on-site, hybrid or remote. The salary range for this role is 62,900 USD - 119,700 USD. The salary range provided is a good faith estimate representative of all experience levels. RTX considers several factors when extending an offer, including but not limited to, the role, function and associated responsibilities, a candidate’s work experience, location, education/training, and key skills. Hired applicants may be eligible for benefits, including but not limited to, medical, dental, vision, life insurance, short-term disability, long-term disability, 401(k) match, flexible spending accounts, flexible work schedules, employee assistance program, Employee Scholar Program, parental leave, paid time off, and holidays. Specific benefits are dependent upon the specific business unit as well as whether or not the position is covered by a collective-bargaining agreement. Hired applicants may be eligible for annual short-term and/or long-term incentive compensation programs depending on the level of the position and whether or not it is covered by a collective-bargaining agreement. Payments under these annual programs are not guaranteed and are dependent upon a variety of factors including, but not limited to, individual performance, business unit performance, and/or the company’s performance. This role is a U.S.-based role. If the successful candidate resides in a U.S. territory, the appropriate pay structure and benefits will apply. RTX anticipates the application window closing approximately 40 days from the date the notice was posted. However, factors such as candidate flow and business necessity may require RTX to shorten or extend the application window. RTX is an Equal Opportunity Employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability or veteran status, or any other applicable state or federal protected class. RTX provides affirmative action in employment for qualified Individuals with a Disability and Protected Veterans in compliance with Section 503 of the Rehabilitation Act and the Vietnam Era Veterans’ Readjustment Assistance Act. Privacy Policy and Terms: Click on this link to read the Policy and Terms Le ciel est vaste. La propulsion est un moteur de progrès humain. Elle permet de transporter les gens dans une multitude de destinations et dans des lieux où l’humanité n’aurait jamais pensé possible de poser le pied. Chez Pratt &amp;amp; Whitney, vous ferez partie d’une entreprise diversifiée et mondiale en constante évolution, qui façonne l’avenir de l’aviation et offre une foule d’occasions de carrière, de perfectionnement et d’épanouissement. Les clients du monde entier comptent sur nos technologies et les personnes qui en sont à l’origine. En tant que membre de l’équipe de Pratt &amp;amp; Whitney, vous relèverez les défis de la propulsion d’aujourd’hui tout en imaginant les solutions de demain.">
