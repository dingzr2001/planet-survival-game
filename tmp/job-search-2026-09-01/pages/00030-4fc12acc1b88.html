  <meta name="description" content="EvenUp is on a mission to close the justice gap using technology and AI. We empower personal injury lawyers and victims to get the justice they deserve. Our products enable law firms to secure faster settlements, higher payouts, and better outcomes for victims injured through no fault of their own in vehicle collisions, accidents, natural disasters, and more.

We are one of the fastest-growing vertical SaaS companies in history, and we are just getting started. EvenUp is backed by top VCs, including Bessemer Venture Partners, Bain Capital Ventures, SignalFire, and Lightspeed. We are looking to expand our team with talented, driven, and collaborative individuals who seek to have a lasting impact. Learn more at www.evenuplaw.com http://www.evenuplaw.com.


🎥 LIFE AS AN ENGINEER AT EVENUP




About the team: 

Our Data Products Engineering team is looking for a Software Engineer to help build software integrations that improve the experience for EvenUp customers. If you&#39;re passionate about understanding user needs and eager to dig into real problems, we&#39;d love to have you on the team. You&#39;ll work closely with our engineering team to help enhance our integration engine, learning from experienced engineers while contributing to what we build next. This role is a great opportunity to grow your skills while making a direct, visible impact on the business from day one. Come join us in shaping the future of legal tech.

What you&#39;ll do:

 - Actively engage in the full project lifecycle across the stack, with full ownership from conception to deployment and iteration.

 - Collaborate closely with backend engineers, product owners &amp; designers to develop efficient, innovative solutions.

 - Collaborate with stakeholders to gather requirements and translate them into technical solutions.

 - Conceptualize the design and development of interfaces and integration architecture.

 - Document technical interface requirements and convert specifications into technical designs.

 - Solve problems with extensive programming skills and abilities in multiple coding languages and frameworks.

 - Optimizing application performance and responsiveness to ensure a smooth user experience.

What we look for:

 - Development Experience: Internship experience or 1 year of hands-on, relevant experience crafting applications and services, ensuring intuitive and user-friendly experiences.

 - Technical Expertise: Extensive experience in integrating with third-party vendors while designing and implementing efficient and dependable integration frameworks.

 - API Design and Development: Skilled in crafting RESTful APIs adhering to industry best practices and standards, coupled with a willingness to impart knowledge and mentor fellow engineers.

 - Versatile Skillset: Solid grasp of software development fundamentals, encompassing data structures, algorithms, design patterns, and familiarity with various protocols like SOAP, REST, and GraphQL, along with server-side languages like SQL.

 - Skilled Communication: Ability to communicate technical ideas or issues in easy-to-understand and actionable terms.

 - Bonus: experience with React/Typescript and experience in AI, legal tech, and social impact projects.


#LI-HYBRID

Benefits &amp; Perks:

As part of our total rewards package, we offer attractive benefits and perks to our employees, including:

 - Choice of medical, dental, and vision insurance plans for you and your family.

 - Additional insurance coverage options for life, accident, or critical illness.

 - Flexible paid time off,  sick leave, short-term and long-term disability.

 - 10 US observed holidays, and Canadian statutory holidays by province.

 - A home office stipend.

 - 401(k) for US-based employees and RRSP for Canada-based employees.

 - Paid parental leave.

 - A local in-person meet-up program.

 - Hubs in San Francisco and Toronto.

(Please note the above benefits &amp; perks are for full-time employees)

Notice to Candidates:

To ensure fairness and proper consideration, we do not accept resumes or expressions of interest via email or social media messages. If you’re interested in a role, please submit your application directly through our careers page https://www.evenuplaw.com/careers.

Please note that EvenUp may use AI notetakers and other recording devices in the recruiting process. If you interview with us, with your consent, we may record your conversations and summarize them into notes for internal use. Recording is optional, and declining will not affect your candidacy. 

EvenUp is an equal opportunity employer. We are committed to diversity and inclusion in our company. We do not discriminate based on race, religion, color, national origin, gender, sexual orientation, age, marital status, veteran status, or disability status." />

through no fault of their own in vehicle collisions, accidents, natural disasters, and more.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We are one of the fastest-growing vertical SaaS companies in history, and we are just getting started. EvenUp is backed by top VCs, including Bessemer Venture Partners, Bain Capital Ventures, SignalFire, and Lightspeed. We are looking to expand our team with talented, driven, and collaborative individuals who seek to have a lasting impact. Learn more at <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://www.evenuplaw.com\"><u>www.evenuplaw.com</u></a>.</p><p style=\"min-height:1.5em\"></p><h1><strong>🎥 Life as an Engineer at EvenUp</strong></h1><h1></h1><div><div style=\"left:0;width:100%;height:0;position:relative;padding-bottom:56.25%\"><iframe src=\"https://embedded-media.ashbyhq.com/embed/a97fe582-eed6-4222-8b27-7d21ab589363/6fdcd50a-7e02-4ba2-b0d5-ca6dcad3d29d\" style=\"top:0;left:0;width:100%;height:100%;position:absolute;border:0\" allowfullscreen scrolling=\"no\" allow=\"encrypted-media *; picture-in-picture *;\" sandbox=\"allow-scripts allow-same-origin allow-presentation\"></iframe></div></div><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About the team: </strong></p><p style=\"min-height:1.5em\">Our Data Products Engineering team is looking for a Software Engineer to help build software integrations that improve the experience for EvenUp customers. If you're passionate about understanding user needs and eager to dig into real problems, we'd love to have you on the team. You'll work closely with our engineering team to help enhance our integration engine, learning from experienced engineers while contributing to what we build next. This role is a great opportunity to grow your skills while making a direct, visible impact on the business from day one. Come join us in shaping the future of legal tech.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What you'll do:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Actively engage in the full project lifecycle across the stack, with full ownership from conception to deployment and iteration.</p></li><li><p style=\"min-height:1.5em\">Collaborate closely with backend engineers, product owners &amp; designers to develop efficient, innovative solutions.</p></li><li><p style=\"min-height:1.5em\">Collaborate with stakeholders to gather requirements and translate them into technical solutions.</p></li><li><p style=\"min-height:1.5em\">Conceptualize the design and development of interfaces and integration architecture.</p></li><li><p style=\"min-height:1.5em\">Document technical interface requirements and convert specifications into technical designs.</p></li><li><p style=\"min-height:1.5em\">Solve problems with extensive programming skills and abilities in multiple coding languages and frameworks.</p></li><li><p style=\"min-height:1.5em\">Optimizing application performance and responsiveness to ensure a smooth user experience.</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>What we look for:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Development Experience</strong>: Internship experience or 1 year of hands-on, relevant experience crafting applications and services, ensuring intuitive and user-friendly experiences.</p></li><li><p style=\"min-height:1.5em\"><strong>Technical Expertise</strong>: Extensive experience in integrating with third-party vendors while designing and implementing efficient and dependable integration frameworks.</p></li><li><p style=\"min-height:1.5em\"><strong>API Design and Development</strong>: Skilled in crafting RESTful APIs adhering to industry best practices and standards, coupled with a willingness to impart knowledge and mentor fellow engineers.</p></li><li><p style=\"min-height:1.5em\"><strong>Versatile Skillset</strong>: Solid grasp of software development fundamentals, encompassing data structures, algorithms, design patterns, and familiarity with various protocols like SOAP, REST, and GraphQL, along with server-side languages like SQL.</p></li><li><p style=\"min-height:1.5em\"><strong>Skilled Communication</strong>: Ability to communicate technical ideas or issues in easy-to-understand and actionable terms.</p></li><li><p style=\"min-height:1.5em\"><strong>Bonus</strong>: experience with React/Typescript and experience in AI, legal tech, and social impact projects.</p></li></ul><p style=\"min-height:1.5em\"></p><h3>#LI-Hybrid</h3><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Benefits &amp; Perks:</strong></p><p style=\"min-height:1.5em\">As part of our total rewards package, we offer attractive benefits and perks to our employees, including:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Choice of medical, dental, and vision insurance plans for you and your family.</p></li><li><p style=\"min-height:1.5em\">Additional insurance coverage options for life, accident, or critical illness.</p></li><li><p style=\"min-height:1.5em\">Flexible paid time off,  sick leave, short-term and long-term disability.</p></li><li><p style=\"min-height:1.5em\">10 US observed holidays, and Canadian statutory holidays by province.</p></li><li><p style=\"min-height:1.5em\">A home office stipend.</p></li><li><p style=\"min-height:1.5em\">401(k) for US-based employees and RRSP for Canada-based employees.</p></li><li><p style=\"min-height:1.5em\">Paid parental leave.</p></li><li><p style=\"min-height:1.5em\">A local in-person meet-up program.</p></li><li><p style=\"min-height:1.5em\">Hubs in San Francisco and Toronto.</p></li></ul><p style=\"min-height:1.5em\"><em>(Please note the above benefits &amp; perks are for full-time employees)</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em><strong>Notice to Candidates:</strong></em></p><p style=\"min-height:1.5em\"><em>To ensure fairness and proper consideration, we do not accept resumes or expressions of interest via email or social media messages. If you’re interested in a role, please submit your application directly through our </em><a target=\"_blank\" rel=\"noopener noreferrer\" class=\"c-link c-link--focus-visible\" href=\"https://www.evenuplaw.com/careers\"><em>careers page</em></a><em>.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Please note that EvenUp may use AI notetakers and other recording devices in the recruiting process. If you interview with us, with your consent, we may record your conversations and summarize them into notes for internal use. Recording is optional, and declining will not affect your candidacy. </em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>EvenUp is an equal opportunity employer. We are committed to diversity and inclusion in our company. We do not discriminate based on race, religion, color, national origin, gender, sexual orientation, age, marital status, veteran status, or disability status.</em></p>","secondaryLocationNames":["Toronto (hybrid)"],"teamNames":["Engineering"],"compensationTierSummary":"$130K • Offers Equity • Multiple Ranges","compensationTiers":[{"id":"55d1adbf-64bf-4638-b03a-5a36e1277718","title":"San Francisco","tierSummary":"$130K • Offers Equity"},{"id":"d0027240-a233-437e-bf25-7fe02bbcb2e4","title":"Toronto ","tierSummary":"CA$113K • Offers Equity"}],"applicationDeadline":null,"compensationTierGuideUrl":null,"scrapeableCompensationSalarySummary":"$130K","compensationPhilosophyHtml":"<p style=\"min-height:1.5em\">The salary range provided reflects the compensation that EvenUp reasonably expects to offer for this role. The specific salary within this range will be determined based on various factors, including the candidate's relevant experience, education, skills, location, and alignment with the role's responsibilities.</p>
