    <meta name="title" property="og:title" content="Software Development Engineer I - Early Career (2027 Starts)">
    <meta name="description" property="og:description" content="Application close date: Applications will be accepted on an ongoing basis until the requisition is closed. At Blue Origin, we envision millions of people living and working in space for the benefit of Earth. We’re working to develop reusable, safe, and low-cost space vehicles and systems within a culture of safety, collaboration, and inclusion. Join our team of problem solvers as we add new chapters to the history of spaceflight!  - We are collaborators, doers, and problem-solvers who are relentlessly committed to a culture of safety. This position will directly impact the history of space exploration and will require your commitment and detailed attention towards safe and repeatable space flight. Join us in lowering the cost of access to space and enabling Blue Origin’s vision of millions of people living and working in space to benefit Earth. Multiple positions available across our Business Units. You will be matched with an appropriate engineering team based on your skillset and experience and our current business needs. Timeline: Applications will be reviewed on a rolling basis. Primary locations: We prioritize placing early career engineers in locations where they can be co-located with their team and the relevant hardware they support. The primary locations for this role are listed below. Please indicate in the application where you would be willing to be located. Kent, WA Responsibilities include but are not limited to:  As a part of a passionate team of engineers, you will contribute to the software development life cycle including requirements analysis, design, coding, testing, and maintenance. Based upon your placement, your projects may involve many aspects of applied systems analysis, software testing, quality assurance, DevOps, data analysis. Collaborate with multidisciplinary teams to understand their needs and design solutions that accelerate all phases of vehicle development, testing, and operations. Troubleshoot and fix software issues at multiple levels, including both server-side and client side. Qualifications: Minimum of a BS Degree in computer science, computer engineering, electrical engineering, or a related field.  Will have earned their degree within the last year and able to start by Fall 2027. Experience with: A modern, object-oriented language such as Java, C#, C++, Python, etc. Applying computer science fundamentals like data structures and algorithms. Solving problems by writing efficient, working code. Utilizing source control such as git. Relevant internship/co-op and/or hands-on experience that demonstrate development of both technical skills as well as leadership qualities. Ability to earn trust, maintain positive and professional relationships, and strengthen our culture of inclusion. Ability to work independently and as part of a team on rapid development programs. Flexible and adaptable mindset. Self-driven with the ability to seek out requirements with minimal direction. Desired: Advanced degree in computer science, computer engineering, electrical engineering, or a related field.  Experience with on-premises and cloud-based infrastructures, particularly AWS.  Experience with modern development tools and practices such as git, Docker, and Kubernetes.  Familiarity with rich user experience development in HTML, CSS, and JavaScript frameworks like React.  Experience developing and testing real-time embedded systems, vehicle or industrial control systems, gaming systems, device drivers, or mobile devices. How to prepare: We are solving challenging, new problems and we need people to represent a wide variety of perspectives. Experience in aerospace is not a requirement. We value broad academic and industry experiences such as Tech, Oil &amp;amp; Gas, Nuclear, Automotive, and more. When you apply, include your internship, co-curricular and research experience in your resume. Please also include the relevant programming languages you have used in these settings. If you haven’t yet used a tool in a professional setting, please include relevant coursework that demonstrates your preparation for these roles. Base Pay Range for: CA applicants is $110,623.00 - $154,871.85 CO applicants is $101,405.00 - $141,966.30 WA applicants is $110,623.00 - $154,871.85 Other site ranges may differ Culture Statement Don’t meet all desired requirements? Studies have shown that some people are less likely to apply to jobs unless they meet every single desired qualification. At Blue Origin, we are dedicated to building an authentic workplace, so if you’re excited about this role but your past experience doesn’t align perfectly with every desired qualification in the job description, we encourage you to apply anyway. You may be just the right candidate for this or other roles. Export Control Regulations Applicants for employment at Blue Origin must be a U.S. citizen or national, U.S. permanent resident (i.e. current Green Card holder), or lawfully admitted into the U.S. as a refugee or granted asylum. Background Check Required for all positions: Blue’s Standard Background Check Required for Certain Job Profiles: Defense Biometric Identification System (DBIDS) background check if at any time the role requires one to be on a military installation Required for Certain Job Profiles: Drivers who operate Commercial Motor Vehicles with a Gross Vehicle Weight (GVW), Gross Vehicle Weight Rating (GVWR) or combination of power unit and trailer that meets or exceeds 10,001 lbs. and/or transports placardable amounts of hazardous materials by ground in any vehicle on a public road while in commerce, may be subject to additional Federal Motor Carrier Safety Regulations including: Driver Qualification Files, Medical Certification (obtained before onboarding), Road Test, Hours of Service, Drug and Alcohol Testing, vehicle inspection requirements, CDL requirements (if applicable) and hazardous materials transportation/shipping training. Required for certain Job Profiles: Ability to obtain and maintain Merchant Mariner Credential, which includes pre-employment and random drug testing as well as DOT physical Benefits Benefits include: Medical, dental, vision, basic and supplemental life insurance, paid parental leave, short and long-term disability, 401(k) with a company match of up to 5%, and an Education Support Program. Stock Options for all regular employees (working at least 20 hours/week) Paid Time Off: Up to four (4) weeks per year based on weekly scheduled hours, and up to 14 company-paid holidays. Dependent on role type and job level, employees may be eligible for benefits and bonuses based on the company&#39;s intent to reward individual contributions and enable them to share in the company&#39;s results, or other factors at the company&#39;s sole discretion. Bonus amounts and eligibility are not guaranteed and subject to change and cancellation. Please check with your recruiter for more details. Equal Employment Opportunity Blue Origin is proud to be an Equal Opportunity/Affirmative Action Employer and is committed to attracting, retaining, and developing a highly qualified and dedicated work force. Blue Origin hires and promotes people on the basis of their qualifications, performance, and abilities. We support the establishment and maintenance of a workplace that fosters trust, equality, and teamwork. We provide all qualified applicants for employment and employees with equal opportunities for hire, promotion, and other terms and conditions of employment, regardless of their race, color, religion, sex, sexual orientation, gender identity, national origin/ethnicity, age, physical or mental disability, genetic factors, military/veteran status, or any other status or characteristic protected by federal, state, and/or local law. Blue Origin will consider for employment qualified applicants with criminal histories in a manner consistent with applicable federal, state, and local laws, including the Washington Fair Chance Act, the California Fair Chance Act, the Los Angeles Fair Chance in Hiring Ordinance, and other applicable laws. For more information on “Know Your Rights,” please see here. Affirmative Action and Disability Accommodation Applicants wishing to receive information on Blue Origin’s Affirmative Action Plans, or applicants requiring a reasonable accommodation in order to participate in the application and/or interview process, please contact us at EEOCompliance@blueorigin.com. Please note this is a publicly managed inbox. Please do not include any personal medical information in your request. We’re committed to building the road to space so our children can build the future. We are a mission-driven company focused on ideas and innovation, and encourage fresh perspectives from bold voices. At Blue, our team is building the future as their unique selves. Thank you for your interest in working at Blue Origin! Blue Origin was founded with a vision to enable a future where millions of people are living and working in space to benefit Earth. In order to preserve Earth, Blue Origin believes in the need to enable humanity to expand, explore, find new energy and material resources, and move industries that stress Earth into space. Blue Origin believes it has an important role in building a road to space and lowering the cost of getting there. At Blue Origin, we’re working on this today by developing fully reusable launch vehicles and systems that are safe, reliable and affordable. Every launch vehicle is designed for human spaceflight from the beginning and able to ferry payloads to space. California Applicant Privacy Notice">
