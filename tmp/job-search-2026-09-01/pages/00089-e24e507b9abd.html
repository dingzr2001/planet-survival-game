    <meta name="description" property="og:description" content="Alation is pioneering the next era of data intelligence — powered by AI agents and trusted data. Organizations around the world rely on Alation to drive self-service analytics, cloud transformation, data governance, and AI innovation. Our technology helps enterprises connect people and data to make faster, smarter, and more confident decisions. With more than $340M in funding – valued at over $1.7 billion and more than 650 customers, including 40% of the Fortune 100. As data becomes the foundation of every business, Alation is leading the way in helping organizations unlock their full potential. By bringing intelligence, automation, and trust to every interaction, we empower customers to scale data-driven innovation with confidence and speed. Joining Alation means being part of a winning team shaping the future of AI-powered data intelligence. We move fast, think big, and deliver results together. Job Description: We&#39;re looking for a UX Engineer I to join the Applied AI squad at Alation. You&#39;ll contribute frontend code across the product — and bring the design sensibility to make it good. That means you&#39;re not just building what&#39;s specced; you&#39;re the person who notices when interactions are inconsistent, who thinks about the component library holistically, and who makes thoughtful decisions about color, hierarchy, progressive disclosure, and making the product intuitive to use. You&#39;ll collaborate closely with product management and engineering on a workspace that combines copilot interactions, data visualization, and generative workflows. Your job is to ship frontend code that&#39;s well-built and well-designed. We work in a hybrid model—you’ll join us in our Redwood City office 2 days per week (Tue/Thurs) to collaborate, connect, and enjoy a team atmosphere! Local candidates only, no relocation is offered. This is a full time contract. $40.00/hr. Open to contract-to-hire. What You&#39;ll Do Contribute frontend code in our production codebase. You&#39;re an engineer first who can write clean, reviewable code and work within our stack and development workflow Bring design judgment to everything you build. Color auditing, interaction consistency, component reuse, information hierarchy, progressive disclosure — you care about this stuff and you act on it Work through ambiguous product problems alongside PM and engineering. Identify the use cases, map the user mental models, and make opinionated design decisions grounded in that understanding Iterate based on feedback from the team and from real users. Treat designs as hypotheses to be tested, not deliverables to be handed off Who You Are Recently completed a degree in CS, HCI, interaction design, product design, or a related field You write frontend code. React, TypeScript, HTML/CSS — you can work in a real codebase with version control and code review, not just a sandbox You have a portfolio that shows things you designed and built. We want to see work where you had ownership of the interaction, thinking and the implementation. Be ready to talk through the decisions, not just the deliverables You have a design eye. You notice when something&#39;s off — inconsistent patterns, unclear hierarchy, interactions that don&#39;t feel right — and you know how to fix it, not just flag it AI-native in your workflow. You use AI tools to move faster, but you have the design judgment to direct the output and know when it&#39;s not good enough Fast, curious, and low-ego. You&#39;d rather ship and learn than polish in isolation Nice to Have Experience designing AI-powered interfaces: copilots, chat-based workflows, or generative UX patterns Familiarity with data-dense interfaces — dashboards, tables, multi-panel layouts #LI-Hybrid #LI-MF1 Alation, Inc. is an Equal Employment Opportunity employer. All qualified applicants will receive consideration for employment without regards to that individual’s race, color, religion or creed, national origin or ancestry, sex (including pregnancy), sexual orientation, gender identity, age, physical or mental disability, veteran status, genetic information, ethnicity, citizenship, or any other characteristic protected by law. The Company will strive to provide reasonable accommodations to permit qualified applicants who have a need for an accommodation to participate in the hiring process (e.g., accommodations for a job interview) if so requested. This company participates in E-Verify. Click on any of the links below to view or print the full poster. E-Verify and Right to Work. Our growth is creating great opportunities! Our team is expanding, and we want to hire the most talented people we can. Continued success depends on it! So once you&#39;ve had a chance to explore our current open positions, apply to the ones you feel suit you best and keep track of both your progress in the selection process, and new postings that might interest you! Thanks for your interest in working on our team!! Introduce yourself to our recruiters and we&#39;ll get in touch if there&#39;s a role that seems like a good match. Our founders have come together from different backgrounds: business, engineering, and design. This unique mix from our founding team is important to the Alation culture story. Today, our team consists of creators and communicators with varied backgrounds - from Stanford, to the Indian Institute of Technology, big companies and one-person startups, the United States, and abroad. We continue to seek ever more diverse perspectives as we grow. We are an equal opportunity employer and value diversity at our company. We do not discriminate on the basis of race, name, religion, color, national origin, gender identity and expression, sexual orientation, age, marital status, veteran status, or disability status. Why Alation? Market-Leading Data Catalog Provider High-growth, collaborative environment with diverse and inclusive teams Continuous learning, enrichment and development opportunities Competitive pay and health offerings including commuter benefits Flexible time off to relax and recharge">
