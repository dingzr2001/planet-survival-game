    <meta name="title" property="og:title" content="Associate Software Engineer II (Infrastructure &amp;amp; Automation)">
    <meta name="description" property="og:description" content="We are hiring an Associate Software Engineer II (Infrastructure &amp;amp; Automation) on our Process Automation &amp;amp; BI Reporting team at BlueCross BlueShield of Tennessee! In this role, you will help drive automation and process improvement initiatives across the organization while supporting the infrastructure that powers our Robotic Process Automation (RPA) platform. You will work hands-on with Windows and Linux servers, Active Directory, security patching, firewall troubleshooting, and infrastructure administration to support enterprise-wide automation solutions. As part of the team responsible for both RPA platform support and automation development, you&#39;ll play a critical role in modernizing workflows, enhancing operational efficiency, and helping expand the organization&#39;s automation capabilities. To be successful in this role, you&#39;ll bring strong infrastructure and server administration experience along with excellent troubleshooting and problem-solving skills. Required Qualifications: Experience with Windows and Linux based server administration Strong experience with Active Directory, Password safes, PowerShell, and Bash scripting. Experience supporting enterprise infrastructure and working with security patching, vulnerability remediation and firewall administration Experience working with DNS, TCP/IP, Encryption , SSL/TLS certificates and related infrastructure components Experience supporting virtualized infrastructure (VMware), and cloud environments (Azure/AWS) Strong communication and troubleshooting skills Preferred Qualifications Experience with UiPath RPA Development and UiPath Cloud Components Familiarity with Agile and Azure DevOps Note: This is a remote, work-from-home position, but the final round of interviews will take place on-site at our Chattanooga, TN HQ Participation in an on-call support schedule is required Sponsorship is not available for this role Job Responsibilities Formulates and defines system scope and objectives through research to design, develop, modify, or integrate moderately complex information systems. Devises or modifies application systems and procedures to optimize functional requirements including capacity, operating time, response time, and form of desired results. Designs, codes, tests, debugs, and documents programs, subroutines, and scripts. Must be competent to work on most phases of applications systems analysis, and must maintain technical skill set for software languages, databases, platforms, operating systems, etc. Responds to system failures and performance events by taking appropriate measures to reduce system downtime and eliminate recurrence of problems. Provides services to multiple project teams or management staff, provides guidance to less-experienced programmers, and may conduct presentations to provide end users with knowledge to maximize their use of developed systems. May serve one or more project team roles, such as project lead, business systems analyst, or technical lead, for small to medium efforts. . Job Qualifications Education Bachelors Degree in Computer Science or equivalent work experience required. Equivalent years of experience are determined as one year of technical experience for every year of college requested. Experience 2 years - Experience in programming required 1 year - Experience with information technology concepts, application development methodology, terminology, and standards required 1 year - Expert working knowledge of at least one programming language in use at BCBST. Skills\Certifications Proven skill with information technology in use at BCBST is required Excellent oral and written communication skills Number of Openings Available 1 Worker Type: Employee Company: BCBST BlueCross BlueShield of Tennessee, Inc. Applying for this job indicates your acknowledgement and understanding of the following statements: BCBST will recruit, hire, train and promote individuals in all job classifications without regard to race, religion, color, age, sex, national origin, citizenship, pregnancy, veteran status, sexual orientation, physical or mental disability, gender identity, or any other characteristic protected by applicable law. Further information regarding BCBST&#39;s EEO Policies/Notices may be found by reviewing the following page: BCBST&#39;s EEO Policies/Notices BlueCross BlueShield of Tennessee is not accepting unsolicited assistance from search firms for this employment opportunity. All resumes submitted by search firms to any employee at BlueCross BlueShield of Tennessee via-email, the Internet or any other method without a valid, written Direct Placement Agreement in place for this position from BlueCross BlueShield of Tennessee HR/Talent Acquisition will not be considered. No fee will be paid in the event the applicant is hired by BlueCross BlueShield of Tennessee as a result of the referral or through other means. As Tennessee&#39;s largest health benefit plan company, we&#39;ve been helping Tennesseans find their own unique paths to good health since 1945. More than that, we&#39;re your neighbors and friends – fellow Tennesseans with deep roots of caring tradition, a focused approach to physical, financial and community good health for today, and a bright outlook for an even healthier tomorrow. At BCBST, we empower our employees to thrive both independently and collaboratively, creating a collective impact on the lives of our members. We seek talented individuals who excel in a team environment, share responsibility, and embrace accountability. We&#39;re also seeking candidates who are proficient in the Microsoft Office suite, including Microsoft Teams, organized, and capable of managing multiple assignments or projects simultaneously. Additional, strong interpersonal abilities along with strong oral and written communication skills are important across all roles at BCBST. We foster a culture where innovation is encouraged. That includes using AI enabled tools responsibly to support everyday work — guided by proven workflows, templates, and policies. As roles become more advanced, we expect employees to leverage AI more broadly to transform how we serve members. BCBST is a remote-first organization with many employees working primarily from their homes. Each position within the company is classified as either fully remote, partially remote, or office based. BCBST hires employees for remote positions from across the U.S. with the exception of the following states: California, Massachusetts, New Hampshire, New Jersey, and New York. Applicants living in these states may move to an approved state prior to starting a position with BCBST at their own expense. If the position requires the individual to reside in Chattanooga, TN, they may be eligible for relocation assistance.">
