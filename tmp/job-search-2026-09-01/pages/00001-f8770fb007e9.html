  <meta name="description" content="🚀 JOIN THE FUTURE OF COMMERCE WITH WHATNOT!

Whatnot is the largest live shopping platform in North America and Europe to buy, sell, and discover the things you love. Whether it&#39;s trading cards, fashion, electronics, or live plants, our sellers are building real businesses across hundreds of categories. We&#39;re building live commerce at a scale that&#39;s never been done in the West, and there&#39;s no playbook to copy. The people here are shaping how an entirely new industry develops.

As a remote co-located team, we&#39;re inspired by our values https://www.whatnot.com/careers#principles and anchored in hubs across the US, UK, Ireland, Poland, Germany, and Australia. We move fast, stay close to our users, and focus on the work that drives the most impact.

We&#39;re one of the fastest growing marketplaces https://www.nytimes.com/2025/10/28/business/dealbook/whatnot-livestream-shopping-fundraise.html and were recently named the #1 Best Startup Employer in America https://www.forbes.com/lists/americas-best-startup-employers/ by Forbes. Check out the latest Whatnot updates on our news https://blog.teamwhatnot.com/ and engineering blogs https://medium.com/whatnot-engineering and join us as we enable anyone to turn their passion into a business and bring people together through commerce.

💻 Role

We are looking for intellectually curious, highly motivated individuals to join us post grad in 2027. The most important skills you’ll need to have are making sound product decisions and shipping high-quality products fast. We look for engineers with great product instincts who can own whole projects from start to finish.

The engineering team operates with a high level of autonomy so we need to hire people we can trust. Your ability to make good trade-offs and exercise good judgment is essential to us. Some job duties include:

 - Building new features for users in our live-streams

 - Implementing growth tactics and strategies to scale our buyer and seller flows

 - Building systems at scale that help us deliver a high trust marketplace experience 

 - Writing product or system development code

 - Designing, implementing, and operating our most critical and scalable services

 - Carefully evaluating the technical tradeoffs of every decision

 - Supporting features at every phase, from design through implementation and launch

 - Triage product or system issues and debug/track/resolve by analyzing the sources of issues, network, or service operations and quality.

We offer flexibility to work from home or from one of our global office hubs, and we value in-person time for planning, problem-solving, and connection. Team members in this role must live within commuting distance of one of our following hubs; Los Angeles, New York City, San Francisco, or Seattle 


👋 YOU

People who do well at Whatnot tend to be comfortable figuring things out as they go, biased toward action, and genuinely curious about what they&#39;re building. They care more about outcomes than credit and stay close to the product and the people using it.

As our next Engineer you should have some industry software engineering experience, plus:

 - Graduated with a CS or Software Engineering degree by Summer 2027

 - Problem solver and out-of-the-box thinker

 - Willing to take risks and build product and systems for 1M+ users

 - Capable of building scalable systems

 - Excellent product instincts. You first think about users rather than the best technical solution

 - You are known for shipping products and features lightning-fast

 - Ability to pick up on new technologies very quickly

 - Open to relocation to Los Angeles, New York City, San Francisco, or Seattle 


🎁 BENEFITS

 - Generous Holiday and Time off Policy

 - Health Insurance options including Medical, Dental, Vision

 - Work From Home Support
   
   - Home office setup allowance
   
   - Monthly allowance for cell phone and internet

 - Care benefits
   
   - Monthly allowance for wellness
   
   - Annual allowance towards Childcare
   
   - Lifetime benefit for family planning, such as adoption or fertility expenses

 - Retirement; 401k offering for Traditional and Roth accounts in the US (employer match up to 4% of base salary) and Pension plans internationally

 - Monthly allowance to dogfood the app
   
   - All Whatnauts are expected to develop a deep understanding of our product. We&#39;re passionate about building the best user experience, and all employees are expected to use Whatnot as both a buyer and a seller as part of their job (our dogfooding budget makes this fun and easy!).

 - Parental Leave
   
   - 16 weeks of paid parental leave + one month gradual return to work *company leave allowances run concurrently with country leave requirements which take precedence.


💛 EOE

Whatnot is proud to be an Equal Opportunity Employer. We value diversity, and we do not discriminate on the basis of race, religion, color, national origin, gender, sexual orientation, age, marital status, veteran status, parental status, disability status, or any other status protected by local law. We believe that our work is better and our company culture is improved when we encourage, support, and respect the different skills and experiences represented within our workforce." />

laybook to copy. The people here are shaping how an entirely new industry develops.</p><p style=\"min-height:1.5em\">As a remote co-located team, we're inspired by our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.whatnot.com/careers#principles\"><u>values</u></a> and anchored in hubs across the US, UK, Ireland, Poland, Germany, and Australia. We move fast, stay close to our users, and focus on the work that drives the most impact.</p><p style=\"min-height:1.5em\">We're one of the <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.nytimes.com/2025/10/28/business/dealbook/whatnot-livestream-shopping-fundraise.html\"><u>fastest growing marketplaces</u></a> and were recently named the <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.forbes.com/lists/americas-best-startup-employers/\"><u>#1 Best Startup Employer in America</u></a> by Forbes. Check out the latest Whatnot updates on our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.teamwhatnot.com/\"><u>news</u></a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/whatnot-engineering\"><u>engineering blogs</u></a> and join us as we enable anyone to turn their passion into a business and bring people together through commerce.</p><p style=\"min-height:1.5em\"><strong>💻 Role</strong></p><p style=\"min-height:1.5em\">We are looking for intellectually curious, highly motivated individuals to join us post grad in 2027. The most important skills you’ll need to have are making sound product decisions and shipping high-quality products fast. We look for engineers with great product instincts who can own whole projects from start to finish.</p><p style=\"min-height:1.5em\">The engineering team operates with a high level of autonomy so we need to hire people we can trust. Your ability to make good trade-offs and exercise good judgment is essential to us. Some job duties include:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Building new features for users in our live-streams</p></li><li><p style=\"min-height:1.5em\">Implementing growth tactics and strategies to scale our buyer and seller flows</p></li><li><p style=\"min-height:1.5em\">Building systems at scale that help us deliver a high trust marketplace experience </p></li><li><p style=\"min-height:1.5em\">Writing product or system development code</p></li><li><p style=\"min-height:1.5em\">Designing, implementing, and operating our most critical and scalable services</p></li><li><p style=\"min-height:1.5em\">Carefully evaluating the technical tradeoffs of every decision</p></li><li><p style=\"min-height:1.5em\">Supporting features at every phase, from design through implementation and launch</p></li><li><p style=\"min-height:1.5em\">Triage product or system issues and debug/track/resolve by analyzing the sources of issues, network, or service operations and quality.</p></li></ul><p style=\"min-height:1.5em\"><strong>We offer flexibility to work from home or from one of our global office hubs, and we value in-person time for planning, problem-solving, and connection. Team members in this role must live within commuting distance of one of our following hubs; Los Angeles, New York City, San Francisco, or Seattle </strong></p><p style=\"min-height:1.5em\"></p><h2><strong>👋 You</strong></h2><p style=\"min-height:1.5em\">People who do well at Whatnot tend to be comfortable figuring things out as they go, biased toward action, and genuinely curious about what they're building. They care more about outcomes than credit and stay close to the product and the people using it.</p><p style=\"min-height:1.5em\">As our next Engineer you should have some industry software engineering experience, plus:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Graduated with a CS or Software Engineering degree by Summer 2027</p></li><li><p style=\"min-height:1.5em\">Problem solver and out-of-the-box thinker</p></li><li><p style=\"min-height:1.5em\">Willing to take risks and build product and systems for 1M+ users</p></li><li><p style=\"min-height:1.5em\">Capable of building scalable systems</p></li><li><p style=\"min-height:1.5em\">Excellent product instincts. You first think about users rather than the best technical solution</p></li><li><p style=\"min-height:1.5em\">You are known for shipping products and features lightning-fast</p></li><li><p style=\"min-height:1.5em\">Ability to pick up on new technologies very quickly</p></li><li><p style=\"min-height:1.5em\">Open to relocation to Los Angeles, New York City, San Francisco, or Seattle </p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>🎁 Benefits</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Generous Holiday and Time off Policy</p></li><li><p style=\"min-height:1.5em\">Health Insurance options including Medical, Dental, Vision</p></li><li><p style=\"min-height:1.5em\">Work From Home Support</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Home office setup allowance</p></li><li><p style=\"min-height:1.5em\">Monthly allowance for cell phone and internet</p></li></ul></li><li><p style=\"min-height:1.5em\">Care benefits</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Monthly allowance for wellness</p></li><li><p style=\"min-height:1.5em\">Annual allowance towards Childcare</p></li><li><p style=\"min-height:1.5em\">Lifetime benefit for family planning, such as adoption or fertility expenses</p></li></ul></li><li><p style=\"min-height:1.5em\">Retirement; 401k offering for Traditional and Roth accounts in the US (employer match up to 4% of base salary) and Pension plans internationally</p></li><li><p style=\"min-height:1.5em\">Monthly allowance to dogfood the app</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">All Whatnauts are expected to develop a deep understanding of our product. We're passionate about building the best user experience, and all employees are expected to use Whatnot as both a buyer and a seller as part of their job (our dogfooding budget makes this fun and easy!).</p></li></ul></li><li><p style=\"min-height:1.5em\">Parental Leave</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">16 weeks of paid parental leave + one month gradual return to work *company leave allowances run concurrently with country leave requirements which take precedence.</p></li></ul></li></ul><h2><strong>💛 EOE</strong></h2><p style=\"min-height:1.5em\">Whatnot is proud to be an Equal Opportunity Employer. We value diversity, and we do not discriminate on the basis of race, religion, color, national origin, gender, sexual orientation, age, marital status, veteran status, parental status, disability status, or any other status protected by local law. We believe that our work is better and our company culture is improved when we encourage, support, and respect the different skills and experiences represented within our workforce.</p>","secondaryLocationNames":["San Francisco, CA","Los Angeles, CA","Seattle, WA"],"teamNames":["Early Career","Engineering New Grads"],"compensationTierSummary":"$155K – $160K • Offers Equity","compensationTiers":[{"id":"3b5b0841-f1c3-47a9-b59c-52a05213eeb2","title":null,"tierSummary":"$155K – $160K • Offers Equity"}],"applicationDeadline":null,"compensationTierGuideUrl":null,"scrapeableCompensationSalarySummary":"$155K - $160K","compensationPhilosophyHtml":"<p style=\"min-height:1.5em\">The salary or hourly rate range may be inclusive of several levels that would be applicable to the position. Final salary or hourly rate will be based on a number of factors including, level, relevant prior experience, skills, and expertise. This range is only inclusive of base salary or hourly rate, not benefits or equity.</p>","shouldAskForTextingConsent":false,"shouldAskForWhatsAppConsent":false,"legalEntityNameForTextingConsent":"
