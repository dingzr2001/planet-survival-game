    <meta name="title" property="og:title" content="Software Development Engineer">
    <meta name="description" property="og:description" content="We begin with dreams. Dreams drive our motivation. Dreams are our future. The world&#39;s dreams, people&#39;s dreams, our dreams. Our passion creates ideas that make dreams come alive. Technology and products that were only dreams become reality. All for dreams. Dreams challenge and the Nidec-Group will continue to meet the challenge. For the world&#39;s and people&#39;s tomorrows; the world&#39;s first, the world&#39;s best technologies and products; we will continue our part in creating a better society. Job Summary Objective The Software Development Engineer I develops embedded software by following defined ASPICE processes as directed by the Software Development on a program. Essential Responsibilities ● Assists the Software Development Project Leader in design and development as an active member of the team. ● Writes and modifies software documentation (incl. Requirements, design documents and test specifications) ● Implements code as directed by the Software Development Project Leader. ● Fixes bugs/problems in code during the development and maintenance phases and modifies corresponding documentation. ● Creates test cases, executes tests and logs the defects. ● Updates the status of issues in the problem tracking system. ● Coordinates with laboratory personnel on the testing of prototypes. ● Collaborates with production to achieve safe launches of programs and maintain existing ones. Experience: 0 - 1+ years of software development engineering experience (embedded focus preferred). Education: Bachelor’s degree in Electronics Engineering, Electrical Engineering, Computer Engineering, or an equivalent technical field. Knowledge/Skills/Abilities - Required - ● Strong foundation in embedded programming using C or C++ for 8-bit, 16-bit, and 32-bit microcontroller target environments ● Proficiency using lab equipment (e.g., Oscilloscopes, Logic analyzers, Function generators) ● Proficiency in Microsoft Office Suite (Word, Excel, Power Point) ● Experience with software version control systems (e.g., Git) Optional Skills (Not mandatory, knowledge on any of the following is a plus) ● Experience with Python / any scripting language ● Familiarity with Modeling / SW design tools (Doxygen, or UML tools) ● Familiarity with the Atlassian Suite tools (Bitbucket, Jira, Confluence) ● Familiarity with deploying software via continuous integration and continuous delivery (CI/CD) pipelines (e.g., Jenkins) NOTE: This position Is Not open to external sourcing (Recruiting agencies) All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, or status as a protected veteran. Job Description Additional Job Details Equal Employment Opportunity and Affirmative Action at Nidec Nidec is an Equal Employment Opportunity (EEO) and Affirmative Action Employer encouraging diversity in the workplace. All qualified applicants receive consideration for employment without regard to their age, gender, gender identity, sexual orientation, race, color, genetic information, religious creed, national origin, physical or mental disability, protected veteran status, or any other characteristic protected by law. For more information regarding your (EEO) rights as an applicant, please visit the following website: http://www1.eeoc.gov/employers/upload/eeoc_self_print_poster.pdf Work Shift Schedule First Shift (United States of America) No Soliciting Nidec will not accept unsolicited resumes from individual recruiters or third party recruiting agencies in response to Nidec job postings. No fee will be paid to third parties who submit unsolicited candidates directly to our hiring managers. Pre-approval from the Nidec Talent Acquisition team is required before any external candidate can be submitted and such candidate must be submitted to the Nidec Talent Acquisition team. Nidec has worked its way up to become the world&#39;s No.1 manufacturer of small precision motors. In the process, Nidec has gradually expanded its product lineup to include a variety of small to large motors, application products for machinery, and electronic and optical components. At present, its products are used in a wide range of fields and devices including information and telecommunications equipment, office equipment, home appliances, automobiles, industrial equipment, and environmental energy. &quot;For Everything that Spins and Moves&quot;, the Group is creating next-generation drive technologies to meet the needs of the society.">
