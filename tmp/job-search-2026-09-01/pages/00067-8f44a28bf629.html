    <meta name="description" property="og:description" content="Junior DevOps Engineer Who We Are: Kudu Dynamics is Leidos Owned Company, forged out of a decade of experience in computer network operations and staffed with talent who have built, overseen, and enhanced capabilities throughout the entire USG arsenal. Our team of hackers and engineers have experience spanning centuries of research, development, and operations missions - across desktop, mobile, IoT, and embedded platforms. Kudu Dynamics, a Leidos company is uniquely qualified to anticipate tomorrow’s threats and build the next generation of capabilities. Minimum Requirements: US Citizenship with TS/SCI and Counter-Intelligence Polygraph clearance 1–3 years of experience in DevOps, Systems Engineering, or Infrastructure Support Bachelor’s degree in Computer Science, Information Technology, Engineering, or related field Familiarity with Linux system administration Experience with Docker or containerized applications Basic experience with CI/CD tools such as GitLab CI/CD Exposure to infrastructure automation tools such as Terraform or Ansible Familiarity with monitoring and logging tools (Grafana, Prometheus, ELK, etc.) Experience troubleshooting deployment or environment issues Understanding of networking fundamentals and system troubleshooting Ability to work within an Agile Scrum team Self-starter requiring moderate supervision Intelligent, proactive, and driven to achieve results Specific Duties: Support deployment and maintenance of development and production environments Assist with CI/CD pipeline implementation and troubleshooting Monitor system health, logging, and alerting platforms Support container orchestration and infrastructure automation efforts Troubleshoot infrastructure and deployment-related issues Assist with onboarding users and environment access requests Document operational procedures and deployment processes Work closely with software developers to improve deployment reliability If you&#39;re looking for comfort, keep scrolling. At Leidos, we outthink, outbuild, and outpace the status quo — because the mission demands it. We&#39;re not hiring followers. We&#39;re recruiting the ones who disrupt, provoke, and refuse to fail. Step 10 is ancient history. We&#39;re already at step 30 — and moving faster than anyone else dares. Original Posting: August 31, 2026 For U.S. Positions: While subject to change based on business needs, Leidos reasonably anticipates that this job requisition will remain open for at least 3 days with an anticipated close date of no earlier than 3 days after the original posting date as listed above. Pay Range: Pay Range $69,550.00 - $125,725.00 The Leidos pay range for this job level is a general guideline only and not a guarantee of compensation or salary. Additional factors considered in extending an offer include (but are not limited to) responsibilities of the job, education, experience, knowledge, skills, and abilities, as well as internal equity, alignment with market data, applicable bargaining agreement (if any), or other law. Leidos Leidos is an industry and technology leader serving government and commercial customers with smarter, more efficient digital and mission innovations. Headquartered in Reston, Virginia, with 47,000 global employees, Leidos reported annual revenues of approximately $17.2 billion for the fiscal year ended January 2, 2026. For more information, visit www.Leidos.com. Pay and Benefits Pay and benefits are fundamental to any career decision. That&#39;s why we craft compensation packages that reflect the importance of the work we do for our customers. Employment benefits include competitive compensation, Health and Wellness programs, Income Protection, Paid Leave and Retirement. More details are available here. Securing Your Data Leidos will never ask you to provide payment-related information at any part of the employment application process. And Leidos will communicate with you only through
